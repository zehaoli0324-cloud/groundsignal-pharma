name: s3a-v051-compositional-regression

on:
  push:
    paths:
      - "scripts/s3a_compositional_frame_parser_v051.py"
      - ".github/workflows/s3a-v051-compositional-regression.yml"
  workflow_dispatch:

jobs:
  exposed-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/s3a_compositional_frame_parser_v051.py \
            scripts/s3a_compositional_frame_parser_v05.py \
            scripts/s3a_semantic_frame_extractor_v04.py \
            scripts/eval_s3a_proposition_extraction_v02.py

      - name: Run exposed v0.1-v0.4 regressions
        run: |
          mkdir -p /tmp/s3a-v051
          declare -a suites=(
            "s3a-extraction-gold-v0.1.json"
            "s3a-extraction-heldout-v0.2.json"
            "s3a-extraction-heldout-v0.3.json"
            "s3a-semantic-frame-heldout-v0.4.json"
          )
          failed=0
          for suite in "${suites[@]}"; do
            stem="${suite%.json}"
            python scripts/s3a_compositional_frame_parser_v051.py \
              --input "medical/stage-evals/S3/${suite}" \
              --out "/tmp/s3a-v051/${stem}-predictions.json"
            set +e
            python scripts/eval_s3a_proposition_extraction_v02.py \
              --gold "medical/stage-evals/S3/${suite}" \
              --pred "/tmp/s3a-v051/${stem}-predictions.json" \
              --out "/tmp/s3a-v051/${stem}-report.json" \
              --min-f1 0.90 \
              --min-critical-recall 0.95 \
              --min-polarity-accuracy 0.95 \
              --min-population-accuracy 0.95 \
              --min-condition-accuracy 0.95
            status=$?
            set -e
            echo "${suite} evaluator_exit=${status}"
            cat "/tmp/s3a-v051/${stem}-report.json"
            if [ "${status}" -ne 0 ]; then failed=1; fi
          done
          echo "${failed}" > /tmp/s3a-v051/aggregate-failed.txt

      - name: Validate v0.5.1 trace contract
        if: always()
        run: |
          python - <<'PY'
          import glob, json
          problems=[]
          for p in glob.glob('/tmp/s3a-v051/*-predictions.json'):
              d=json.load(open(p, encoding='utf-8'))
              for row in d['predictions']:
                  if not {'scope_nodes','semantic_frames','predicted_propositions'} <= set(row):
                      problems.append((p,row.get('item_id'),'missing top-level trace'))
                      continue
                  for node in row['scope_nodes']:
                      if 'condition_source' not in node:
                          problems.append((p,row.get('item_id'),'missing condition_source'))
                  for f in row['semantic_frames']:
                      req={'event_type','subject','object','polarity','modality','source_span','trigger_family','scope_trace'}
                      if not req <= set(f):
                          problems.append((p,row.get('item_id'),'missing frame keys'))
                          continue
                      if not f.get('trigger_family'):
                          problems.append((p,row.get('item_id'),'empty trigger_family'))
                      if not isinstance(f.get('scope_trace'), dict) or not f.get('scope_trace'):
                          problems.append((p,row.get('item_id'),'empty scope_trace'))
          assert not problems, problems
          print('S3a v0.5.1 compositional trace contract OK')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3a-v051-exposed-regression
          path: /tmp/s3a-v051
          retention-days: 90

      - name: Enforce exposed regression gate
        if: always()
        run: |
          test "$(cat /tmp/s3a-v051/aggregate-failed.txt)" = "0"
