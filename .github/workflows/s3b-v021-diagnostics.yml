name: s3b-v021-diagnostics

on:
  push:
    paths:
      - 'scripts/s3b_entailment_engine_v021.py'
      - 'scripts/s3b_structured_entailment_runner_v021.py'
      - '.github/workflows/s3b-v021-diagnostics.yml'
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/s3b_entailment_engine_v021.py \
            scripts/s3b_structured_entailment_runner_v021.py \
            scripts/eval_s3b_structured_entailment.py
      - name: Run exposed S3b v0.1 and v0.2 regressions
        run: |
          mkdir -p /tmp/s3b-v021
          for suite in s3b-entailment-gold-v0.1 s3b-entailment-heldout-v0.2; do
            python scripts/s3b_structured_entailment_runner_v021.py \
              --input medical/stage-evals/S3/${suite}.json \
              --out /tmp/s3b-v021/${suite}-pred.json
            set +e
            python scripts/eval_s3b_structured_entailment.py \
              --gold medical/stage-evals/S3/${suite}.json \
              --pred /tmp/s3b-v021/${suite}-pred.json \
              --out /tmp/s3b-v021/${suite}-report.json \
              --min-relation-accuracy 0.90 \
              --max-high-risk-false-support 0.0
            status=$?
            set -e
            cat /tmp/s3b-v021/${suite}-report.json
            echo "S3b v0.2.1 ${suite} exit code: ${status} (exposed diagnostic only)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: s3b-v021-diagnostics
          path: /tmp/s3b-v021
          retention-days: 30
