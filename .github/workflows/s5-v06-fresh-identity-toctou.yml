name: S5 v0.6 Historical Fresh First-Observation Preservation

on:
  push:
    paths:
      - 'scripts/eval_s5_fresh_boundary_v06.py'
      - 'medical/stage-evals/S5/fresh-boundary-v0.6/**'
      - 'medical/stage-evals/S5/fresh-first-observation-v0.6.json'
      - 'medical/stage-evals/S5/failures-v0.6.json'
      - 'medical/stage-evals/S5/S5_V0.6_FRESH_IDENTITY_TOCTOU_FAIL_REPORT.md'
      - '.github/workflows/s5-v06-fresh-identity-toctou.yml'
  pull_request:
    paths:
      - 'scripts/eval_s5_fresh_boundary_v06.py'
      - 'medical/stage-evals/S5/fresh-boundary-v0.6/**'
      - 'medical/stage-evals/S5/fresh-first-observation-v0.6.json'
      - 'medical/stage-evals/S5/failures-v0.6.json'
      - 'medical/stage-evals/S5/S5_V0.6_FRESH_IDENTITY_TOCTOU_FAIL_REPORT.md'
      - '.github/workflows/s5-v06-fresh-identity-toctou.yml'

jobs:
  preserve-first-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Protect immutable v0.6 evidence blobs
        run: |
          test "$(git rev-parse HEAD:medical/stage-evals/S5/fresh-first-observation-v0.6.json)" = 'f855e853ea2af9705cd3db478a3a40848459e0ea'
          test "$(git rev-parse HEAD:medical/stage-evals/S5/failures-v0.6.json)" = '94652c3f311df19e5a7dd6c9364420df1acf73c3'

      - name: Reproduce v0.6 first observation at historical commit
        run: |
          historical_commit='e406c122765501ad6ebfbbee9fcea00d75a452cb'
          cp medical/stage-evals/S5/fresh-first-observation-v0.6.json /tmp/s5-v06-expected.json
          rm -rf /tmp/groundsignal-s5-v06-historical
          git worktree add --detach /tmp/groundsignal-s5-v06-historical "$historical_commit"
          cd /tmp/groundsignal-s5-v06-historical
          python -m py_compile scripts/eval_s5_fresh_boundary_v06.py
          set +e
          python scripts/eval_s5_fresh_boundary_v06.py --out /tmp/s5-v06-reproduced.json
          status=$?
          set -e
          test "$status" -eq 1

      - name: Match immutable historical metrics exactly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('/tmp/s5-v06-expected.json').read_text(encoding='utf-8'))
          observed=json.loads(Path('/tmp/s5-v06-reproduced.json').read_text(encoding='utf-8'))
          assert observed == expected
          assert observed['precondition_failures'] == []
          assert observed['hard_gate_failures'] == ['S5-F20','S5-F21','S5-F22','S5-F23']
          assert observed['fresh_structural_gate'] == 'FAIL'
          assert observed['stage_release'] == 'BLOCKED_GOLD_REVIEW'
          assert observed['s6_automatic_trust'] == 'BLOCKED'
          print('S5 v0.6 immutable fresh FAIL reproduced at its historical implementation snapshot.')
          PY
