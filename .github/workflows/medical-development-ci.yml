name: medical-development-ci

on:
  push:
    paths:
      - 'medical/**'
      - 'posttrain/**'
      - 'scripts/model_harness.py'
      - 'scripts/intervention_router.py'
      - 'scripts/export_training_data.py'
      - 'scripts/regression_gate.py'
      - 'scripts/validate_medical_case_families.py'
      - 'scripts/validate_medical_knowledge_sources.py'
      - 'scripts/build_medical_knowledge_graph.py'
      - 'scripts/s2_source_router.py'
      - 'scripts/eval_s2_source_routing.py'
      - '.github/workflows/medical-development-ci.yml'
  pull_request:
    paths:
      - 'medical/**'
      - 'posttrain/**'
      - 'scripts/model_harness.py'
      - 'scripts/intervention_router.py'
      - 'scripts/export_training_data.py'
      - 'scripts/regression_gate.py'
      - 'scripts/validate_medical_case_families.py'
      - 'scripts/validate_medical_knowledge_sources.py'
      - 'scripts/build_medical_knowledge_graph.py'
      - 'scripts/s2_source_router.py'
      - 'scripts/eval_s2_source_routing.py'
      - '.github/workflows/medical-development-ci.yml'

jobs:
  medical-platform-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/model_harness.py \
            scripts/intervention_router.py \
            scripts/export_training_data.py \
            scripts/regression_gate.py \
            scripts/validate_medical_case_families.py \
            scripts/validate_medical_knowledge_sources.py \
            scripts/build_medical_knowledge_graph.py \
            scripts/s2_source_router.py \
            scripts/eval_s2_source_routing.py

      - name: Validate P0 medical case families
        run: |
          python scripts/validate_medical_case_families.py \
            --expect-families 12 \
            --expect-cases 60 \
            --expect-cases-per-family 5 \
            --rubric-version medical-clinical-v0.2

      - name: Validate medical knowledge source metadata
        run: |
          python scripts/validate_medical_knowledge_sources.py --strict-hosts

      - name: Run S2 v0.1 source-routing regression
        run: |
          mkdir -p /tmp/groundsignal-s2
          python scripts/s2_source_router.py \
            --input medical/stage-evals/S2/routing-gold-v0.1.json \
            --out /tmp/groundsignal-s2/predictions-v01.json
          python scripts/eval_s2_source_routing.py \
            --gold medical/stage-evals/S2/routing-gold-v0.1.json \
            --pred /tmp/groundsignal-s2/predictions-v01.json \
            --out /tmp/groundsignal-s2/report-v01.json

      - name: Run first S2 v0.2 held-out routing baseline
        run: |
          python scripts/s2_source_router.py \
            --input medical/stage-evals/S2/routing-heldout-v0.2.json \
            --out /tmp/groundsignal-s2/predictions-v02-heldout.json
          set +e
          python scripts/eval_s2_source_routing.py \
            --gold medical/stage-evals/S2/routing-heldout-v0.2.json \
            --pred /tmp/groundsignal-s2/predictions-v02-heldout.json \
            --out /tmp/groundsignal-s2/report-v02-heldout.json
          status=$?
          set -e
          cat /tmp/groundsignal-s2/report-v02-heldout.json
          echo "S2 v0.2 first held-out exit code: $status (non-blocking baseline run)"

      - name: Build canonical medical knowledge graph
        run: |
          python scripts/build_medical_knowledge_graph.py \
            --out /tmp/groundsignal-medical-kg.json
          python - <<'PY'
          import json
          p='/tmp/groundsignal-medical-kg.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['summary']['node_count'] > 0
          assert d['summary']['edge_count'] > 0
          print(json.dumps(d['summary'], ensure_ascii=False, indent=2))
          PY

      - name: Validate vertical-slice JSON fixtures parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path('medical/examples/clinical-medication-safety-001.json'),
              Path('medical/configs/model-matrix.fixture.json'),
              Path('medical/configs/regression-policy.medication-safety-v0.1.json'),
              Path('medical/knowledge-base/SOURCE_REGISTRY.json'),
              Path('medical/knowledge-base/SOURCE_REGISTRY_SUPPLEMENT.json'),
              Path('medical/knowledge-base/PHARMACOLOGY_BACKBONE_V0.1.json'),
              Path('medical/knowledge-base/ORGAN_SPECIAL_POP_SAFETY_BACKBONE_V0.1.json'),
              Path('medical/stage-evals/S2/routing-gold-v0.1.json'),
              Path('medical/stage-evals/S2/routing-heldout-v0.2.json'),
          ]:
              json.loads(p.read_text(encoding='utf-8'))
              print('OK', p)
          for p in [
              Path('medical/examples/evidence.jsonl'),
              Path('medical/examples/eval-baseline.jsonl'),
              Path('medical/examples/eval-candidate.jsonl'),
          ]:
              for line in p.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      json.loads(line)
              print('OK', p)
          PY

      - name: Run model harness fixture
        run: |
          mkdir -p /tmp/groundsignal
          python scripts/model_harness.py \
            --cases medical/examples/clinical-medication-safety-001.json \
            --config medical/configs/model-matrix.fixture.json \
            --evidence medical/examples/evidence.jsonl \
            --out /tmp/groundsignal/runs.jsonl
          test "$(wc -l < /tmp/groundsignal/runs.jsonl)" -eq 2

      - name: Route baseline failure
        run: |
          python scripts/intervention_router.py \
            --eval medical/examples/eval-baseline.jsonl \
            --rules medical/configs/intervention-rules.json \
            --out /tmp/groundsignal/routed.jsonl \
            --summary /tmp/groundsignal/router-summary.json

      - name: Export approved post-training candidate
        run: |
          python scripts/export_training_data.py \
            --cases medical/examples/clinical-medication-safety-001.json \
            --runs /tmp/groundsignal/runs.jsonl \
            --eval medical/examples/eval-baseline.jsonl \
            --out-dir /tmp/groundsignal/training
          test "$(wc -l < /tmp/groundsignal/training/preference.jsonl)" -eq 1

      - name: Regression release gate
        run: |
          python scripts/regression_gate.py \
            --baseline medical/examples/eval-baseline.jsonl \
            --candidate medical/examples/eval-candidate.jsonl \
            --policy medical/configs/regression-policy.medication-safety-v0.1.json \
            --out /tmp/groundsignal/regression-report.json
