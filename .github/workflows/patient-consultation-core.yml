name: Patient consultation core
on:
  push:
    branches: [work/patient-consultation-core-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify focused core without model API calls
        run: python scripts/verify_core.py --out runs/ci-core
      - name: Preserve verification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-offline-verification
          path: runs/ci-core/
