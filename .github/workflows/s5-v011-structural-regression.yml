name: S5 v0.1.1 Structural Repair Historical Preservation

on:
  push:
    paths:
      - 'medical/stage-evals/S5/structural-regression-v0.1.1.json'
      - 'medical/stage-evals/S5/release-gate-v0.1.1.json'
      - '.github/workflows/s5-v011-structural-regression.yml'
  pull_request:
    paths:
      - 'medical/stage-evals/S5/structural-regression-v0.1.1.json'
      - 'medical/stage-evals/S5/release-gate-v0.1.1.json'
      - '.github/workflows/s5-v011-structural-regression.yml'

jobs:
  preserve-v011-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Protect committed v0.1.1 metrics blobs
        run: |
          test "$(git rev-parse HEAD:medical/stage-evals/S5/structural-regression-v0.1.1.json)" = "25007a5952dadc269d1ec7e0db498a3254d313bf"
          test "$(git rev-parse HEAD:medical/stage-evals/S5/release-gate-v0.1.1.json)" = "0d267fe829c1aade48a00f5655e394cb60d1275d"

      - name: Reproduce v0.1.1 against its frozen implementation commit
        run: |
          frozen="37a89d14b37a1e2b3b823e933b4a7bfbd3038af8"
          rm -rf /tmp/groundsignal-s5-v011-frozen
          git worktree add --detach /tmp/groundsignal-s5-v011-frozen "$frozen"
          cd /tmp/groundsignal-s5-v011-frozen
          python scripts/eval_s5_benchmark_factory_v011.py \
            --implementation-parent 811a755120210a14863a485e31c42ed5d3dd5f28 \
            --out /tmp/s5-v011-reproduced.json
          set +e
          python scripts/s5_release_gate.py \
            --suite medical/stage-evals/S5/suite-p0-exposed-v0.1.1.json \
            --out /tmp/s5-v011-release-reproduced.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          structural=json.loads(Path('/tmp/s5-v011-reproduced.json').read_text(encoding='utf-8'))
          structural_expected=json.loads(Path('medical/stage-evals/S5/structural-regression-v0.1.1.json').read_text(encoding='utf-8'))
          release=json.loads(Path('/tmp/s5-v011-release-reproduced.json').read_text(encoding='utf-8'))
          release_expected=json.loads(Path('medical/stage-evals/S5/release-gate-v0.1.1.json').read_text(encoding='utf-8'))
          assert structural == structural_expected
          assert release == release_expected
          assert structural['structural_gate'] == 'PASS'
          assert release['decision'] == 'BLOCKED_GOLD_REVIEW'
          print('S5 v0.1.1 historical observation reproduced at its frozen commit.')
          PY
