name: s3a-v053-preserve-fail

on:
  push:
    paths:
      - ".github/workflows/s3a-v053-preserve-fail.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve-v053-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deterministic diagnostic replay of first FAIL
        run: |
          set -e
          mkdir -p /tmp/s3a-v053
          declare -a suites=(
            "s3a-extraction-gold-v0.1.json"
            "s3a-extraction-heldout-v0.2.json"
            "s3a-extraction-heldout-v0.3.json"
            "s3a-semantic-frame-heldout-v0.4.json"
            "s3a-compositional-frame-heldout-v0.5.1.json"
            "s3a-scope-safety-heldout-v0.5.2.json"
          )
          failed=0
          for suite in "${suites[@]}"; do
            stem="${suite%.json}"
            python scripts/s3a_compositional_frame_parser_v053.py \
              --input "medical/stage-evals/S3/${suite}" \
              --out "/tmp/s3a-v053/${stem}-predictions.json"
            set +e
            python scripts/eval_s3a_proposition_extraction_v02.py \
              --gold "medical/stage-evals/S3/${suite}" \
              --pred "/tmp/s3a-v053/${stem}-predictions.json" \
              --out "/tmp/s3a-v053/${stem}-report.json" \
              --min-f1 0.90 --min-critical-recall 0.95 \
              --min-polarity-accuracy 0.95 --min-population-accuracy 0.95 \
              --min-condition-accuracy 0.95
            status=$?
            set -e
            echo "$status" > "/tmp/s3a-v053/${stem}-evaluator-exit.txt"
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          echo "$failed" > /tmp/s3a-v053/proposition-failed.txt

      - name: Compute safety, trace and combined reports
        run: |
          python - <<'PY'
          import glob,json,os
          from pathlib import Path
          root=Path('/tmp/s3a-v053')
          safety=[]; overall=True
          for suite in ['s3a-compositional-frame-heldout-v0.5.1.json','s3a-scope-safety-heldout-v0.5.2.json']:
              stem=suite[:-5]
              gold=json.load(open('medical/stage-evals/S3/'+suite,encoding='utf-8'))
              pred=json.load(open(root/(stem+'-predictions.json'),encoding='utf-8'))
              pm={x['item_id']:x for x in pred['predictions']}
              req=[x for x in gold['items'] if x.get('expected_abstain')]
              known=[x for x in gold['items'] if not x.get('expected_abstain')]
              req_fail=[]
              for x in req:
                  r=pm.get(x['item_id'],{})
                  if not (bool(r.get('abstain')) and not r.get('predicted_propositions')):
                      req_fail.append(x['item_id'])
              known_abst=[x['item_id'] for x in known if bool(pm.get(x['item_id'],{}).get('abstain'))]
              req_acc=(len(req)-len(req_fail))/len(req) if req else 1.0
              known_rate=len(known_abst)/len(known) if known else 0.0
              crit=gold['release_criteria']
              ok=req_acc>=crit['min_required_abstention_accuracy'] and known_rate<=crit['max_known_case_abstention_rate'] and not req_fail
              safety.append({'suite':suite,'required_abstention_cases':len(req),'required_abstention_accuracy':req_acc,'required_abstention_failures':req_fail,'known_cases':len(known),'known_case_abstentions':known_abst,'known_case_abstention_rate':known_rate,'release_gate':'PASS' if ok else 'FAIL'})
              overall &= ok
          abst={'suites':safety,'release_gate':'PASS' if overall else 'FAIL'}
          (root/'abstention-report.json').write_text(json.dumps(abst,ensure_ascii=False,indent=2)+'\n')

          problems=[]; rows=0
          for p in glob.glob(str(root/'*-predictions.json')):
              d=json.load(open(p,encoding='utf-8'))
              for row in d['predictions']:
                  rows+=1
                  if not {'scope_nodes','semantic_frames','predicted_propositions','abstain','unresolved_spans'} <= set(row):
                      problems.append([os.path.basename(p),row.get('item_id'),'row_contract']); continue
                  for f in row['semantic_frames']:
                      req={'event_type','subject','object','polarity','modality','source_span','trigger_family','scope_trace'}
                      if not req <= set(f) or not f.get('trigger_family') or not isinstance(f.get('scope_trace'),dict) or not f.get('scope_trace'):
                          problems.append([os.path.basename(p),row.get('item_id'),'frame_contract']); break
          trace={'rows':rows,'failures':problems,'release_gate':'PASS' if not problems else 'FAIL'}
          (root/'trace-report.json').write_text(json.dumps(trace,ensure_ascii=False,indent=2)+'\n')

          gold=json.load(open('medical/stage-evals/S3/s3a-scope-safety-heldout-v0.5.2.json',encoding='utf-8'))
          pred=json.load(open(root/'s3a-scope-safety-heldout-v0.5.2-predictions.json',encoding='utf-8'))
          pm={x['item_id']:x for x in pred['predictions']}
          bad=[]
          for x in gold['items']:
              if x.get('expected_abstain'):
                  r=pm.get(x['item_id'],{})
                  if (not r.get('abstain')) or r.get('predicted_propositions'):
                      bad.append({'item_id':x['item_id'],'abstain':r.get('abstain'),'predicted_propositions':r.get('predicted_propositions',[])})
          unsafe={'required_abstention_items':sum(bool(x.get('expected_abstain')) for x in gold['items']),'unsafe_simplifications':bad,'release_gate':'PASS' if not bad else 'FAIL'}
          (root/'unsafe-simplification-report.json').write_text(json.dumps(unsafe,ensure_ascii=False,indent=2)+'\n')

          prop_ok=(root/'proposition-failed.txt').read_text().strip()=='0'
          gates={'all_exposed_proposition_suites':prop_ok,'abstention_safety':abst['release_gate']=='PASS','trace_contract':trace['release_gate']=='PASS','unsafe_simplification_invariant':unsafe['release_gate']=='PASS'}
          combined={'version':'s3a-compositional-frame-v0.5.3','first_fail_workflow':'33997403549','diagnostic_replay_workflow':os.environ.get('GITHUB_RUN_ID'),'parser_commit':'e602e5d20623dcef519a9e51475ebbc6ef32606d','gate_checks':gates,'release_gate':'PASS' if all(gates.values()) else 'FAIL','fresh_validation':'NOT_RUN','note':'Deterministic replay performed without parser modification after the initial exposed-regression FAIL; first FAIL workflow remains the primary chronology record.'}
          (root/'combined-development-release.json').write_text(json.dumps(combined,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(combined,ensure_ascii=False,indent=2))
          PY

      - name: Persist raw diagnostic replay
        if: always()
        run: |
          set -e
          target="medical/stage-evals/S3/runs/s3a-v053-exposed-first-fail"
          mkdir -p "$target"
          cp -a /tmp/s3a-v053/. "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "S3a v0.5.3 eval: preserve exposed first-fail diagnostic replay" || true
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3a-v053-exposed-first-fail-replay
          path: /tmp/s3a-v053
          retention-days: 90

      - name: Enforce replayed combined gate
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/s3a-v053/combined-development-release.json'))
          if d['release_gate']!='PASS': raise SystemExit(2)
          PY
