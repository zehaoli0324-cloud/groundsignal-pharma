name: S5 v0.3 Second Fresh Boundary Historical Preservation

on:
  push:
    paths:
      - 'medical/stage-evals/S5/fresh-first-observation-v0.3.json'
      - 'medical/stage-evals/S5/failures-v0.3.json'
      - 'medical/stage-evals/S5/S5_V0.3_FRESH_BOUNDARY_FAIL_REPORT.md'
      - '.github/workflows/s5-v03-second-fresh-boundary.yml'
  pull_request:
    paths:
      - 'medical/stage-evals/S5/fresh-first-observation-v0.3.json'
      - 'medical/stage-evals/S5/failures-v0.3.json'
      - 'medical/stage-evals/S5/S5_V0.3_FRESH_BOUNDARY_FAIL_REPORT.md'
      - '.github/workflows/s5-v03-second-fresh-boundary.yml'

jobs:
  preserve-first-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Protect committed v0.3 first-observation blob
        run: |
          test "$(git rev-parse HEAD:medical/stage-evals/S5/fresh-first-observation-v0.3.json)" = '47e1669f724f8b2cab285ec0f689cb3819e068e2'

      - name: Reproduce the first observation at its exact commit
        run: |
          first_commit='67df0439fba62d38a8afa0b15cca3e4e25cd05d7'
          cp medical/stage-evals/S5/fresh-first-observation-v0.3.json /tmp/s5-v03-expected.json
          rm -rf /tmp/groundsignal-s5-v03-first
          git worktree add --detach /tmp/groundsignal-s5-v03-first "$first_commit"
          cd /tmp/groundsignal-s5-v03-first
          set +e
          python scripts/eval_s5_fresh_boundary_v03.py --out /tmp/s5-v03-reproduced.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('/tmp/s5-v03-expected.json').read_text(encoding='utf-8'))
          observed=json.loads(Path('/tmp/s5-v03-reproduced.json').read_text(encoding='utf-8'))
          assert observed == expected
          assert observed['fresh_structural_gate'] == 'FAIL'
          assert observed['hard_gate_failures'] == ['S5-F8','S5-F9','S5-F10','S5-F11']
          assert observed['precondition_failures'] == []
          assert observed['stage_release'] == 'BLOCKED_GOLD_REVIEW'
          assert observed['s6_automatic_trust'] == 'BLOCKED'
          print('S5 v0.3 first fresh FAIL reproduced exactly at its original implementation snapshot.')
          PY
