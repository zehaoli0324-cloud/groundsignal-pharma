name: s3a-v052-scope-safety-regression

on:
  push:
    paths:
      - "scripts/s3a_compositional_frame_parser_v052.py"
      - ".github/workflows/s3a-v052-scope-safety-regression.yml"
  workflow_dispatch:

jobs:
  exposed-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/s3a_compositional_frame_parser_v052.py \
            scripts/s3a_compositional_frame_parser_v051.py \
            scripts/s3a_compositional_frame_parser_v05.py \
            scripts/s3a_semantic_frame_extractor_v04.py \
            scripts/eval_s3a_proposition_extraction_v02.py

      - name: Run exposed v0.1-v0.5.1 proposition regressions
        run: |
          mkdir -p /tmp/s3a-v052
          declare -a suites=(
            "s3a-extraction-gold-v0.1.json"
            "s3a-extraction-heldout-v0.2.json"
            "s3a-extraction-heldout-v0.3.json"
            "s3a-semantic-frame-heldout-v0.4.json"
            "s3a-compositional-frame-heldout-v0.5.1.json"
          )
          failed=0
          for suite in "${suites[@]}"; do
            stem="${suite%.json}"
            python scripts/s3a_compositional_frame_parser_v052.py \
              --input "medical/stage-evals/S3/${suite}" \
              --out "/tmp/s3a-v052/${stem}-predictions.json"
            set +e
            python scripts/eval_s3a_proposition_extraction_v02.py \
              --gold "medical/stage-evals/S3/${suite}" \
              --pred "/tmp/s3a-v052/${stem}-predictions.json" \
              --out "/tmp/s3a-v052/${stem}-report.json" \
              --min-f1 0.90 \
              --min-critical-recall 0.95 \
              --min-polarity-accuracy 0.95 \
              --min-population-accuracy 0.95 \
              --min-condition-accuracy 0.95
            status=$?
            set -e
            echo "${suite} evaluator_exit=${status}"
            cat "/tmp/s3a-v052/${stem}-report.json"
            if [ "${status}" -ne 0 ]; then failed=1; fi
          done
          echo "${failed}" > /tmp/s3a-v052/proposition-failed.txt

      - name: Evaluate exposed v0.5.1 abstention safety
        if: always()
        run: |
          python - <<'PY'
          import json
          gold=json.load(open('medical/stage-evals/S3/s3a-compositional-frame-heldout-v0.5.1.json',encoding='utf-8'))
          pred=json.load(open('/tmp/s3a-v052/s3a-compositional-frame-heldout-v0.5.1-predictions.json',encoding='utf-8'))
          pm={x['item_id']:x for x in pred['predictions']}
          req=[x for x in gold['items'] if x.get('expected_abstain')]
          known=[x for x in gold['items'] if not x.get('expected_abstain')]
          req_ok=[]; req_fail=[]
          for x in req:
              r=pm.get(x['item_id'],{})
              ok=bool(r.get('abstain')) and not r.get('predicted_propositions')
              (req_ok if ok else req_fail).append(x['item_id'])
          known_abst=[x['item_id'] for x in known if bool(pm.get(x['item_id'],{}).get('abstain'))]
          req_acc=len(req_ok)/len(req) if req else 1.0
          known_rate=len(known_abst)/len(known) if known else 0.0
          crit=gold['release_criteria']
          report={
            'required_abstention_cases':len(req),
            'required_abstention_correct':len(req_ok),
            'required_abstention_accuracy':req_acc,
            'required_abstention_failures':req_fail,
            'known_cases':len(known),
            'known_case_abstentions':known_abst,
            'known_case_abstention_rate':known_rate,
            'gate_checks':{
              'required_abstention_accuracy':req_acc>=crit['min_required_abstention_accuracy'],
              'known_case_abstention_rate':known_rate<=crit['max_known_case_abstention_rate']}}
          report['release_gate']='PASS' if all(report['gate_checks'].values()) else 'FAIL'
          open('/tmp/s3a-v052/abstention-report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Validate v0.5.2 trace contract
        if: always()
        run: |
          python - <<'PY'
          import glob,json
          problems=[]; rows=0
          for p in glob.glob('/tmp/s3a-v052/*-predictions.json'):
              d=json.load(open(p,encoding='utf-8'))
              for row in d['predictions']:
                  rows+=1
                  if not {'scope_nodes','semantic_frames','predicted_propositions','abstain','unresolved_spans'} <= set(row):
                      problems.append((p,row.get('item_id'),'row_contract')); continue
                  for node in row['scope_nodes']:
                      if not {'node_id','text','condition_source'} <= set(node):
                          problems.append((p,row.get('item_id'),'scope_node_contract')); break
                  for f in row['semantic_frames']:
                      req={'event_type','subject','object','polarity','modality','source_span','trigger_family','scope_trace'}
                      if not req <= set(f) or not f.get('trigger_family') or not isinstance(f.get('scope_trace'),dict) or not f.get('scope_trace'):
                          problems.append((p,row.get('item_id'),'frame_contract')); break
          report={'rows':rows,'failures':problems,'release_gate':'PASS' if not problems else 'FAIL'}
          open('/tmp/s3a-v052/trace-report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Combine development gates
        if: always()
        run: |
          python - <<'PY'
          import json
          prop_ok=open('/tmp/s3a-v052/proposition-failed.txt').read().strip()=='0'
          abst=json.load(open('/tmp/s3a-v052/abstention-report.json',encoding='utf-8'))
          trace=json.load(open('/tmp/s3a-v052/trace-report.json',encoding='utf-8'))
          gates={'all_exposed_proposition_suites':prop_ok,'abstention_safety':abst['release_gate']=='PASS','trace_contract':trace['release_gate']=='PASS'}
          out={'version':'s3a-compositional-frame-v0.5.2','gate_checks':gates,'release_gate':'PASS' if all(gates.values()) else 'FAIL','fresh_validation':'NOT_RUN'}
          open('/tmp/s3a-v052/combined-development-release.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3a-v052-exposed-scope-safety-regression
          path: /tmp/s3a-v052
          retention-days: 90

      - name: Enforce development release gate
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/s3a-v052/combined-development-release.json',encoding='utf-8'))
          if d['release_gate']!='PASS': raise SystemExit(2)
          PY
