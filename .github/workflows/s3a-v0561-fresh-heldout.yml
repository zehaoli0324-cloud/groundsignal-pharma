name: s3a-v0561-fresh-heldout

on:
  push:
    paths:
      - ".github/workflows/s3a-v0561-fresh-heldout.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fresh-first-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify immutable freeze contract
        run: |
          set -euo pipefail
          parser_commit=$(git log -1 --format=%H -- scripts/s3a_compositional_frame_parser_v0561.py)
          parser_blob=$(git rev-parse HEAD:scripts/s3a_compositional_frame_parser_v0561.py)
          suite_commit=$(git log -1 --format=%H -- medical/stage-evals/S3/s3a-reference-discourse-fresh-v0.5.6.1.json)
          suite_blob=$(git rev-parse HEAD:medical/stage-evals/S3/s3a-reference-discourse-fresh-v0.5.6.1.json)
          safety_commit=$(git log -1 --format=%H -- scripts/eval_s3a_safety_errors_v055.py)
          test "${parser_commit}" = "4b7aaabe490e3e477d1d1441b55c5ee656675e1f"
          test "${parser_blob}" = "dc05a6eaccf02592652d0a48b9a712186e5b6507"
          test "${suite_commit}" = "2147ee2d519305ba2bb2be0576a2e316e405b71f"
          test "${suite_blob}" = "d24ddd0d1de4e5574024bd44f7f1764f1d9382c5"
          test "${safety_commit}" = "419bd6f0af79ba3b8665ff5dc09995c9f37d4e82"
          python - <<'PY'
          import json
          d=json.load(open('medical/stage-evals/S3/runs/s3a-v0561-development/combined-development-release.json',encoding='utf-8'))
          assert d['release_gate']=='PASS', d
          assert d['fresh_validation']=='NOT_RUN', d
          PY

      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/s3a_compositional_frame_parser_v0561.py \
            scripts/s3a_compositional_frame_parser_v056.py \
            scripts/s3a_compositional_frame_parser_v055.py \
            scripts/s3a_compositional_frame_parser_v054.py \
            scripts/s3a_compositional_frame_parser_v053.py \
            scripts/s3a_compositional_frame_parser_v052.py \
            scripts/s3a_compositional_frame_parser_v05.py \
            scripts/s3a_semantic_frame_extractor_v04.py \
            scripts/eval_s3a_proposition_extraction_v02.py \
            scripts/eval_s3a_safety_errors_v055.py

      - name: Execute frozen parser once
        run: |
          mkdir -p /tmp/s3a-v0561-fresh
          python scripts/s3a_compositional_frame_parser_v0561.py \
            --input medical/stage-evals/S3/s3a-reference-discourse-fresh-v0.5.6.1.json \
            --out /tmp/s3a-v0561-fresh/predictions.json

      - name: Evaluate proposition gate
        if: always()
        run: |
          set +e
          python scripts/eval_s3a_proposition_extraction_v02.py \
            --gold medical/stage-evals/S3/s3a-reference-discourse-fresh-v0.5.6.1.json \
            --pred /tmp/s3a-v0561-fresh/predictions.json \
            --out /tmp/s3a-v0561-fresh/proposition-report.json \
            --min-f1 0.90 \
            --min-critical-recall 0.95 \
            --min-polarity-accuracy 0.95 \
            --min-population-accuracy 0.95 \
            --min-condition-accuracy 0.95
          status=$?
          set -e
          echo "${status}" > /tmp/s3a-v0561-fresh/proposition-exit.txt

      - name: Evaluate mandatory abstention
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gold=json.load(open('medical/stage-evals/S3/s3a-reference-discourse-fresh-v0.5.6.1.json',encoding='utf-8'))
          pred=json.load(open('/tmp/s3a-v0561-fresh/predictions.json',encoding='utf-8'))
          pm={x['item_id']:x for x in pred['predictions']}
          req=[x for x in gold['items'] if x.get('expected_abstain')]
          known=[x for x in gold['items'] if not x.get('expected_abstain')]
          req_ok=[]; req_fail=[]
          for x in req:
              r=pm.get(x['item_id'],{})
              ok=bool(r.get('abstain')) and not r.get('predicted_propositions')
              (req_ok if ok else req_fail).append(x['item_id'])
          known_abst=[x['item_id'] for x in known if bool(pm.get(x['item_id'],{}).get('abstain'))]
          crit=gold['release_criteria']
          req_acc=len(req_ok)/len(req) if req else 1.0
          known_rate=len(known_abst)/len(known) if known else 0.0
          checks={
              'required_abstention_accuracy':req_acc>=crit['min_required_abstention_accuracy'],
              'known_case_abstention_rate':known_rate<=crit['max_known_case_abstention_rate'],
              'no_partial_truth_on_required_abstention':not req_fail,
          }
          out={'required_abstention_cases':len(req),'required_abstention_correct':len(req_ok),
               'required_abstention_accuracy':req_acc,'required_abstention_failures':req_fail,
               'known_cases':len(known),'known_case_abstentions':known_abst,'known_case_abstention_rate':known_rate,
               'gate_checks':checks,'release_gate':'PASS' if all(checks.values()) else 'FAIL'}
          Path('/tmp/s3a-v0561-fresh/abstention-report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Evaluate semantic safety errors
        if: always()
        run: |
          set +e
          python scripts/eval_s3a_safety_errors_v055.py \
            --gold medical/stage-evals/S3/s3a-reference-discourse-fresh-v0.5.6.1.json \
            --pred /tmp/s3a-v0561-fresh/predictions.json \
            --out /tmp/s3a-v0561-fresh/safety-report.json
          status=$?
          set -e
          echo "${status}" > /tmp/s3a-v0561-fresh/safety-exit.txt

      - name: Validate trace contract
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/s3a-v0561-fresh/predictions.json',encoding='utf-8'))
          problems=[]
          for row in d['predictions']:
              if not {'scope_nodes','semantic_frames','predicted_propositions','abstain','unresolved_spans'} <= set(row):
                  problems.append({'item_id':row.get('item_id'),'reason':'row_contract'}); continue
              for node in row['scope_nodes']:
                  if not {'node_id','text','condition_source'} <= set(node):
                      problems.append({'item_id':row.get('item_id'),'reason':'scope_node_contract'}); break
              for f in row['semantic_frames']:
                  req={'event_type','subject','object','polarity','modality','source_span','trigger_family','scope_trace'}
                  if not req <= set(f) or not f.get('trigger_family') or not isinstance(f.get('scope_trace'),dict) or not f.get('scope_trace'):
                      problems.append({'item_id':row.get('item_id'),'reason':'frame_contract'}); break
          out={'rows':len(d['predictions']),'failures':problems,'release_gate':'PASS' if not problems else 'FAIL'}
          open('/tmp/s3a-v0561-fresh/trace-report.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Combine fresh gates
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          gold_path='medical/stage-evals/S3/s3a-reference-discourse-fresh-v0.5.6.1.json'
          prop_ok=open('/tmp/s3a-v0561-fresh/proposition-exit.txt').read().strip()=='0'
          safety_ok=open('/tmp/s3a-v0561-fresh/safety-exit.txt').read().strip()=='0'
          abst=json.load(open('/tmp/s3a-v0561-fresh/abstention-report.json',encoding='utf-8'))
          trace=json.load(open('/tmp/s3a-v0561-fresh/trace-report.json',encoding='utf-8'))
          gates={'proposition_gate':prop_ok,'abstention_gate':abst['release_gate']=='PASS',
                 'semantic_safety_error_gate':safety_ok,'trace_gate':trace['release_gate']=='PASS'}
          out={'benchmark_id':'S3a-reference-discourse-fresh-v0.5.6.1','gate_checks':gates,
               'release_gate':'PASS' if all(gates.values()) else 'FAIL'}
          open('/tmp/s3a-v0561-fresh/combined-release.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          sha=hashlib.sha256(open(gold_path,'rb').read()).hexdigest()
          open('/tmp/s3a-v0561-fresh/dataset-sha256.txt','w').write(sha+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          print('dataset_sha256',sha)
          PY

      - name: Write immutable manifest
        if: always()
        run: |
          python - <<'PY'
          import json,os
          combined=json.load(open('/tmp/s3a-v0561-fresh/combined-release.json',encoding='utf-8'))
          manifest={
              'benchmark_id':'S3a-reference-discourse-fresh-v0.5.6.1',
              'suite_freeze_commit':'2147ee2d519305ba2bb2be0576a2e316e405b71f',
              'suite_blob_sha':'d24ddd0d1de4e5574024bd44f7f1764f1d9382c5',
              'workflow_source_commit':os.environ.get('GITHUB_SHA'),
              'github_run_id':os.environ.get('GITHUB_RUN_ID'),
              'extractor_version':'s3a-compositional-frame-v0.5.6.1',
              'extractor_commit':'4b7aaabe490e3e477d1d1441b55c5ee656675e1f',
              'extractor_blob_sha':'dc05a6eaccf02592652d0a48b9a712186e5b6507',
              'safety_evaluator_commit':'419bd6f0af79ba3b8665ff5dc09995c9f37d4e82',
              'dataset_sha256':open('/tmp/s3a-v0561-fresh/dataset-sha256.txt').read().strip(),
              'first_observation_must_be_preserved':True,
              'release_gate':combined['release_gate'],
          }
          open('/tmp/s3a-v0561-fresh/manifest.json','w',encoding='utf-8').write(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3a-v0561-fresh-heldout-first-run
          path: /tmp/s3a-v0561-fresh
          retention-days: 90

      - name: Preserve first-run raw outputs before enforcement
        if: always()
        run: |
          dest="medical/stage-evals/S3/runs/s3a-v0561-fresh-first-run"
          mkdir -p "${dest}"
          cp -f /tmp/s3a-v0561-fresh/* "${dest}/"
          cp -f medical/stage-evals/S3/s3a-reference-discourse-fresh-v0.5.6.1.json "${dest}/gold.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${dest}"
          if ! git diff --cached --quiet; then
            git commit -m "S3a v0.5.6.1 eval: preserve fresh first-run raw results"
            git push
          fi

      - name: Enforce fresh release gate
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/s3a-v0561-fresh/combined-release.json',encoding='utf-8'))
          if d['release_gate']!='PASS': raise SystemExit(2)
          PY
