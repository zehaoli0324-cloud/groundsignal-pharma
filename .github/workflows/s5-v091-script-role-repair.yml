name: S5 v0.9.1 Script Role Exposed Repair

on:
  push:
    paths:
      - 'scripts/s5_lineage_detector_v091.py'
      - 'scripts/s5_trust_policy_v091.py'
      - 'scripts/export_training_data_v091.py'
      - 'scripts/eval_s5_boundary_regression_v091.py'
      - 'medical/stage-evals/S5/regression-v0.9.1.json'
      - 'medical/stage-evals/S5/S5_V0.9.1_SCRIPT_ROLE_REPAIR_REPORT.md'
      - '.github/workflows/s5-v091-script-role-repair.yml'
      - 'README.md'
      - 'docs/16-stage-status.md'
      - 'docs/17-evaluation-methods-and-optimization-ledger.md'
      - 'docs/20-s5-v07-algorithm-handoff.md'
  pull_request:
    paths:
      - 'scripts/s5_lineage_detector_v091.py'
      - 'scripts/s5_trust_policy_v091.py'
      - 'scripts/export_training_data_v091.py'
      - 'scripts/eval_s5_boundary_regression_v091.py'
      - 'medical/stage-evals/S5/regression-v0.9.1.json'
      - 'medical/stage-evals/S5/S5_V0.9.1_SCRIPT_ROLE_REPAIR_REPORT.md'
      - '.github/workflows/s5-v091-script-role-repair.yml'
      - 'README.md'
      - 'docs/16-stage-status.md'
      - 'docs/17-evaluation-methods-and-optimization-ledger.md'
      - 'docs/20-s5-v07-algorithm-handoff.md'

jobs:
  exposed-repair-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax and evidence checks
        run: |
          python -m py_compile \
            scripts/s5_lineage_detector_v091.py \
            scripts/s5_trust_policy_v091.py \
            scripts/export_training_data_v091.py \
            scripts/eval_s5_boundary_regression_v091.py
          python -m json.tool medical/stage-evals/S5/regression-v0.9.1.json >/dev/null
          test "$(git hash-object medical/stage-evals/S5/fresh-first-observation-v0.9.json)" = \
            '522c8f4ed39293d2ea01c81f48ffacc1d1ef4340'

      - name: Reproduce exposed repair regression
        run: |
          python scripts/eval_s5_boundary_regression_v091.py --out /tmp/s5-v091-regression.json
          cmp /tmp/s5-v091-regression.json medical/stage-evals/S5/regression-v0.9.1.json

      - name: Confirm repair and containment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/s5-v091-regression.json').read_text())
          assert d['repair_gate']=='PASS'
          assert d['fresh_evidence'] is False
          assert d['first_observation'] is False
          assert all(x['pass'] for x in d['v09_exposed_attacks'].values())
          assert all(x['pass'] for x in d['v09_exposed_clean_controls'].values())
          assert d['immutable_v09_first_observation']['preserved_result']=='FAIL'
          assert d['gold_approved_count']==0
          assert d['stage_release']=='BLOCKED_NEXT_FRESH_AND_GOLD_REVIEW'
          assert d['s6_automatic_trust']=='BLOCKED'
          print('S5 v0.9.1 exposed repair PASS; fresh release, Gold and S6 trust remain blocked.')
          PY

      - name: Reproduce immutable v0.9 first observation
        run: |
          git worktree add --detach /tmp/s5-v09-authoring 42f60341e6daf04196118b85ea6895434d2ec02e
          set +e
          (cd /tmp/s5-v09-authoring && python scripts/eval_s5_fresh_lineage_v09.py --out /tmp/s5-v09-replay.json)
          rc=$?
          set -e
          test "$rc" -eq 1
          cmp /tmp/s5-v09-replay.json medical/stage-evals/S5/fresh-first-observation-v0.9.json
