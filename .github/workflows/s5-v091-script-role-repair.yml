name: S5 v0.9.1 Script Role Exposed Repair

on:
  push:
    paths:
      - 'scripts/s5_lineage_detector_v091.py'
      - 'scripts/s5_trust_policy_v091.py'
      - 'scripts/export_training_data_v091.py'
      - 'scripts/eval_s5_boundary_regression_v091.py'
      - 'scripts/generate_s5_v091_freeze_readiness.py'
      - 'scripts/verify_s5_v091_freeze_readiness.py'
      - 'scripts/test_s5_v091_freeze_readiness.py'
      - 'scripts/s5_v091_freeze_control.py'
      - 'scripts/materialize_s5_v091_freeze_receipt.py'
      - 'scripts/check_s5_v10_fresh_admission.py'
      - 'scripts/test_s5_v091_freeze_control.py'
      - 'scripts/generate_s5_v091_control_plane_readiness.py'
      - 'scripts/verify_s5_v091_control_plane_readiness.py'
      - 'medical/stage-evals/S5/regression-v0.9.1.json'
      - 'medical/stage-evals/S5/freeze-readiness-v0.9.1.json'
      - 'medical/stage-evals/S5/freeze-readiness-check-v0.9.1.json'
      - 'medical/stage-evals/S5/freeze-readiness-tests-v0.9.1.json'
      - 'medical/stage-evals/S5/control-plane-readiness-v0.9.1.json'
      - 'medical/stage-evals/S5/control-plane-readiness-check-v0.9.1.json'
      - 'medical/stage-evals/S5/next-fresh-admission-v0.10.json'
      - 'medical/stage-evals/S5/next-fresh-admission-after-freeze-v0.10.json'
      - 'medical/stage-evals/S5/freeze-control-tests-v0.9.1.json'
      - 'medical/stage-evals/S5/freeze-receipt-v0.9.1.json'
      - 'medical/stage-evals/S5/fresh-lineage-v0.10/**'
      - 'medical/stage-evals/S5/fresh-first-observation-v0.10.json'
      - 'medical/stage-evals/S5/S5_V0.10_FRESH_FIRST_OBSERVATION_REPORT.md'
      - 'medical/stage-evals/S5/S5_V0.9.1_SCRIPT_ROLE_REPAIR_REPORT.md'
      - 'medical/stage-evals/S5/S5_V0.9.1_FREEZE_CONTROL_REPORT.md'
      - '.github/workflows/s5-v091-script-role-repair.yml'
      - 'README.md'
      - 'docs/16-stage-status.md'
      - 'docs/17-evaluation-methods-and-optimization-ledger.md'
      - 'docs/20-s5-v07-algorithm-handoff.md'
  pull_request:
    paths:
      - 'scripts/s5_lineage_detector_v091.py'
      - 'scripts/s5_trust_policy_v091.py'
      - 'scripts/export_training_data_v091.py'
      - 'scripts/eval_s5_boundary_regression_v091.py'
      - 'scripts/generate_s5_v091_freeze_readiness.py'
      - 'scripts/verify_s5_v091_freeze_readiness.py'
      - 'scripts/test_s5_v091_freeze_readiness.py'
      - 'scripts/s5_v091_freeze_control.py'
      - 'scripts/materialize_s5_v091_freeze_receipt.py'
      - 'scripts/check_s5_v10_fresh_admission.py'
      - 'scripts/test_s5_v091_freeze_control.py'
      - 'scripts/generate_s5_v091_control_plane_readiness.py'
      - 'scripts/verify_s5_v091_control_plane_readiness.py'
      - 'medical/stage-evals/S5/regression-v0.9.1.json'
      - 'medical/stage-evals/S5/freeze-readiness-v0.9.1.json'
      - 'medical/stage-evals/S5/freeze-readiness-check-v0.9.1.json'
      - 'medical/stage-evals/S5/freeze-readiness-tests-v0.9.1.json'
      - 'medical/stage-evals/S5/control-plane-readiness-v0.9.1.json'
      - 'medical/stage-evals/S5/control-plane-readiness-check-v0.9.1.json'
      - 'medical/stage-evals/S5/next-fresh-admission-v0.10.json'
      - 'medical/stage-evals/S5/next-fresh-admission-after-freeze-v0.10.json'
      - 'medical/stage-evals/S5/freeze-control-tests-v0.9.1.json'
      - 'medical/stage-evals/S5/freeze-receipt-v0.9.1.json'
      - 'medical/stage-evals/S5/fresh-lineage-v0.10/**'
      - 'medical/stage-evals/S5/fresh-first-observation-v0.10.json'
      - 'medical/stage-evals/S5/S5_V0.10_FRESH_FIRST_OBSERVATION_REPORT.md'
      - 'medical/stage-evals/S5/S5_V0.9.1_SCRIPT_ROLE_REPAIR_REPORT.md'
      - 'medical/stage-evals/S5/S5_V0.9.1_FREEZE_CONTROL_REPORT.md'
      - '.github/workflows/s5-v091-script-role-repair.yml'
      - 'README.md'
      - 'docs/16-stage-status.md'
      - 'docs/17-evaluation-methods-and-optimization-ledger.md'
      - 'docs/20-s5-v07-algorithm-handoff.md'

jobs:
  exposed-repair-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-s5-lineage-calibration.txt
      - name: Install pinned calibration dependency
        run: pip install -r requirements-s5-lineage-calibration.txt

      - name: Syntax and evidence checks
        run: |
          python -m py_compile \
            scripts/s5_lineage_detector_v091.py \
            scripts/s5_trust_policy_v091.py \
            scripts/export_training_data_v091.py \
            scripts/eval_s5_boundary_regression_v091.py \
            scripts/generate_s5_v091_freeze_readiness.py \
            scripts/verify_s5_v091_freeze_readiness.py \
            scripts/test_s5_v091_freeze_readiness.py \
            scripts/s5_v091_freeze_control.py \
            scripts/materialize_s5_v091_freeze_receipt.py \
            scripts/check_s5_v10_fresh_admission.py \
            scripts/test_s5_v091_freeze_control.py \
            scripts/generate_s5_v091_control_plane_readiness.py \
            scripts/verify_s5_v091_control_plane_readiness.py
          python -m json.tool medical/stage-evals/S5/regression-v0.9.1.json >/dev/null
          test "$(git hash-object medical/stage-evals/S5/fresh-first-observation-v0.9.json)" = \
            '522c8f4ed39293d2ea01c81f48ffacc1d1ef4340'

      - name: Reproduce pre-freeze readiness evidence
        run: |
          python scripts/generate_s5_v091_freeze_readiness.py \
            --out /tmp/s5-v091-freeze-readiness.json
          cmp /tmp/s5-v091-freeze-readiness.json \
            medical/stage-evals/S5/freeze-readiness-v0.9.1.json
          python scripts/verify_s5_v091_freeze_readiness.py \
            --out /tmp/s5-v091-freeze-readiness-check.json
          cmp /tmp/s5-v091-freeze-readiness-check.json \
            medical/stage-evals/S5/freeze-readiness-check-v0.9.1.json
          python scripts/test_s5_v091_freeze_readiness.py \
            --out /tmp/s5-v091-freeze-readiness-tests.json
          cmp /tmp/s5-v091-freeze-readiness-tests.json \
            medical/stage-evals/S5/freeze-readiness-tests-v0.9.1.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/s5-v091-freeze-readiness-check.json'))
          tests=json.load(open('/tmp/s5-v091-freeze-readiness-tests.json'))
          assert result['verification_gate']=='PASS'
          assert result['verified_path_count']==result['required_path_count']==24
          assert result['v0.9_fresh_asset_count']==18
          assert result['candidate_frozen'] is False
          assert result['gold_approved'] is False
          assert result['s6_automatic_trust']=='BLOCKED'
          assert tests['scenario_pass_count']==tests['scenario_count']==6
          PY

      - name: Reproduce freeze and v0.10 control-plane evidence
        run: |
          python scripts/generate_s5_v091_control_plane_readiness.py \
            --out /tmp/s5-v091-control-plane.json
          cmp /tmp/s5-v091-control-plane.json \
            medical/stage-evals/S5/control-plane-readiness-v0.9.1.json
          python scripts/verify_s5_v091_control_plane_readiness.py \
            --out /tmp/s5-v091-control-plane-check.json
          cmp /tmp/s5-v091-control-plane-check.json \
            medical/stage-evals/S5/control-plane-readiness-check-v0.9.1.json
          python scripts/check_s5_v10_fresh_admission.py \
            --out /tmp/s5-v10-admission.json
          if test -f medical/stage-evals/S5/freeze-receipt-v0.9.1.json; then
            test "$(git hash-object medical/stage-evals/S5/freeze-receipt-v0.9.1.json)" = \
              '9fb59ab6205b8b37a1574988d386980c953a0839'
            if test -d medical/stage-evals/S5/fresh-lineage-v0.10; then
          python - <<'PY'
          import json
          admission=json.load(open('/tmp/s5-v10-admission.json'))
          assert admission['admission_decision']=='ALLOW_AFTER_VERIFIED_FREEZE'
          assert admission['fresh_asset_count']==19
          assert admission['fresh_protocol_valid'] is True
          assert admission['fresh_authoring_allowed'] is True
          PY
            else
              cmp /tmp/s5-v10-admission.json \
                medical/stage-evals/S5/next-fresh-admission-after-freeze-v0.10.json
            fi
          else
            cmp /tmp/s5-v10-admission.json \
              medical/stage-evals/S5/next-fresh-admission-v0.10.json
          fi
          python scripts/test_s5_v091_freeze_control.py \
            --out /tmp/s5-v091-freeze-control-tests.json
          cmp /tmp/s5-v091-freeze-control-tests.json \
            medical/stage-evals/S5/freeze-control-tests-v0.9.1.json
          python - <<'PY'
          import json
          control=json.load(open('/tmp/s5-v091-control-plane-check.json'))
          admission=json.load(open('/tmp/s5-v10-admission.json'))
          tests=json.load(open('/tmp/s5-v091-freeze-control-tests.json'))
          assert control['verification_gate']=='PASS'
          assert control['verified_path_count']==control['required_path_count']==8
          assert control['candidate_frozen'] is False
          if admission['receipt_present']:
              assert admission['admission_decision']=='ALLOW_AFTER_VERIFIED_FREEZE'
              assert admission['fresh_authoring_allowed'] is True
              assert admission['freeze_commit']=='cdc89298693aa9c5222f15ed9bd62a57e140fbc6'
          else:
              assert admission['admission_decision']=='BLOCKED_NOT_FROZEN'
              assert admission['fresh_authoring_allowed'] is False
          assert admission['gold_approved'] is False
          assert admission['s6_automatic_trust']=='BLOCKED'
          assert tests['scenario_pass_count']==tests['scenario_count']==14
          assert tests['receipt_materialized'] is False
          assert tests['v0.10_assets_created'] is False
          PY

      - name: Reproduce exposed repair regression
        run: |
          python scripts/eval_s5_boundary_regression_v091.py --out /tmp/s5-v091-regression.json
          cmp /tmp/s5-v091-regression.json medical/stage-evals/S5/regression-v0.9.1.json

      - name: Confirm repair and containment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/s5-v091-regression.json').read_text())
          assert d['repair_gate']=='PASS'
          assert d['fresh_evidence'] is False
          assert d['first_observation'] is False
          assert all(x['pass'] for x in d['v09_exposed_attacks'].values())
          assert all(x['pass'] for x in d['v09_exposed_clean_controls'].values())
          assert d['immutable_v09_first_observation']['preserved_result']=='FAIL'
          assert d['gold_approved_count']==0
          assert d['stage_release']=='BLOCKED_NEXT_FRESH_AND_GOLD_REVIEW'
          assert d['s6_automatic_trust']=='BLOCKED'
          print('S5 v0.9.1 exposed repair PASS; fresh release, Gold and S6 trust remain blocked.')
          PY

      - name: Reproduce immutable v0.9 first observation
        run: |
          git worktree add --detach /tmp/s5-v09-authoring 42f60341e6daf04196118b85ea6895434d2ec02e
          set +e
          (cd /tmp/s5-v09-authoring && python scripts/eval_s5_fresh_lineage_v09.py --out /tmp/s5-v09-replay.json)
          rc=$?
          set -e
          test "$rc" -eq 1
          cmp /tmp/s5-v09-replay.json medical/stage-evals/S5/fresh-first-observation-v0.9.json
