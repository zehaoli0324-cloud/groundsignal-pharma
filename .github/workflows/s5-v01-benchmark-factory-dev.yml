name: S5 v0.1 Historical Development Evidence Preservation

on:
  push:
    paths:
      - 'medical/stage-evals/S5/**'
      - 'medical/case-families/**'
      - 'medical/schemas/clinical-case.schema.json'
      - 'scripts/eval_s5_benchmark_factory.py'
      - 'scripts/export_training_data.py'
      - 'scripts/materialize_s5_cases.py'
      - 'scripts/s5_release_gate.py'
      - 'docs/16-stage-status.md'
      - '.github/workflows/s5-v01-benchmark-factory-dev.yml'
  pull_request:
    paths:
      - 'medical/stage-evals/S5/**'
      - 'medical/case-families/**'
      - 'medical/schemas/clinical-case.schema.json'
      - 'scripts/eval_s5_benchmark_factory.py'
      - 'scripts/export_training_data.py'
      - 'scripts/materialize_s5_cases.py'
      - 'scripts/s5_release_gate.py'
      - 'docs/16-stage-status.md'
      - '.github/workflows/s5-v01-benchmark-factory-dev.yml'

jobs:
  preserve-v01-first-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve immutable v0.1 evidence blobs
        run: |
          test "$(git rev-parse HEAD:medical/stage-evals/S5/S5_V0.1_EVAL_SPEC.md)" = "dfa9697c517f37b6f2bd2a5b13b8cc8cb9f6d132"
          test "$(git rev-parse HEAD:medical/stage-evals/S5/development-first-observation-v0.1.json)" = "7ff21096fc39612cf2c0669c13c1b1e332b8175f"
          test "$(git rev-parse HEAD:medical/stage-evals/S5/failures-v0.1.json)" = "74262304e1d5754a14053a60adde7c6efee27037"
          test "$(git rev-parse HEAD:medical/stage-evals/S5/S5_V0.1_DEVELOPMENT_FAIL_REPORT.md)" = "c8f8a2654b76968f0b693d828303eaf6acb8cbee"

      - name: Validate historical semantic decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('medical/stage-evals/S5/development-first-observation-v0.1.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['version']=='v0.1'
          assert d['first_development_observation'] is True
          assert d['fresh_evidence'] is False
          assert d['release']=='FAIL'
          assert d['hard_gate_failures']==['S5-F1','S5-F2','S5-F3']
          print('S5 v0.1 first observation preserved exactly; it is not recomputed against later implementations.')
          PY
