name: S5 v0.7 Historical Fresh Lineage-Generalization Preservation

on:
  push:
    paths:
      - 'scripts/eval_s5_fresh_boundary_v07.py'
      - 'medical/stage-evals/S5/fresh-boundary-v0.7/**'
      - 'medical/stage-evals/S5/fresh-first-observation-v0.7.json'
      - 'medical/stage-evals/S5/failures-v0.7.json'
      - 'medical/stage-evals/S5/S5_V0.7_FRESH_LINEAGE_GENERALIZATION_FAIL_REPORT.md'
      - '.github/workflows/s5-v07-fresh-lineage-generalization-capture.yml'
  pull_request:
    paths:
      - 'scripts/eval_s5_fresh_boundary_v07.py'
      - 'medical/stage-evals/S5/fresh-boundary-v0.7/**'
      - 'medical/stage-evals/S5/fresh-first-observation-v0.7.json'
      - 'medical/stage-evals/S5/failures-v0.7.json'
      - 'medical/stage-evals/S5/S5_V0.7_FRESH_LINEAGE_GENERALIZATION_FAIL_REPORT.md'
      - '.github/workflows/s5-v07-fresh-lineage-generalization-capture.yml'

jobs:
  preserve-first-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Protect immutable v0.7 first-observation blob
        run: |
          test "$(git rev-parse HEAD:medical/stage-evals/S5/fresh-first-observation-v0.7.json)" = '09b2c84c1ebe63dfdc40c0317b73f5b778df733c'

      - name: Reproduce first observation at historical commit
        run: |
          first_commit='e478878e46e8fec04d07ae1c9d12ba4fefd659db'
          cp medical/stage-evals/S5/fresh-first-observation-v0.7.json /tmp/s5-v07-expected.json
          rm -rf /tmp/groundsignal-s5-v07-historical
          git worktree add --detach /tmp/groundsignal-s5-v07-historical "$first_commit"
          cd /tmp/groundsignal-s5-v07-historical
          python -m py_compile scripts/eval_s5_fresh_boundary_v07.py
          set +e
          python scripts/eval_s5_fresh_boundary_v07.py --out /tmp/s5-v07-reproduced.json
          status=$?
          set -e
          test "$status" -eq 1

      - name: Match immutable historical result exactly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('/tmp/s5-v07-expected.json').read_text(encoding='utf-8'))
          observed=json.loads(Path('/tmp/s5-v07-reproduced.json').read_text(encoding='utf-8'))
          assert observed == expected
          assert observed['precondition_failures'] == []
          assert observed['hard_gate_failures'] == ['S5-F24','S5-F25','S5-F26','S5-F27']
          assert observed['fresh_structural_gate'] == 'FAIL'
          assert observed['stage_release'] == 'BLOCKED_GOLD_REVIEW'
          assert observed['s6_automatic_trust'] == 'BLOCKED'
          print('S5 v0.7 independent fresh FAIL preserved exactly at its historical first-observation commit.')
          PY
