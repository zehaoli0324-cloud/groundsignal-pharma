name: s3a-v054-event-graph-regression

on:
  push:
    paths:
      - "scripts/s3a_compositional_frame_parser_v054.py"
      - ".github/workflows/s3a-v054-event-graph-regression.yml"
  workflow_dispatch:

jobs:
  exposed-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/s3a_compositional_frame_parser_v054.py \
            scripts/s3a_compositional_frame_parser_v053.py \
            scripts/s3a_compositional_frame_parser_v052.py \
            scripts/s3a_compositional_frame_parser_v051.py \
            scripts/s3a_compositional_frame_parser_v05.py \
            scripts/s3a_semantic_frame_extractor_v04.py \
            scripts/eval_s3a_proposition_extraction_v02.py

      - name: Run all exposed proposition regressions
        run: |
          mkdir -p /tmp/s3a-v054
          declare -a suites=(
            "s3a-extraction-gold-v0.1.json"
            "s3a-extraction-heldout-v0.2.json"
            "s3a-extraction-heldout-v0.3.json"
            "s3a-semantic-frame-heldout-v0.4.json"
            "s3a-compositional-frame-heldout-v0.5.1.json"
            "s3a-scope-safety-heldout-v0.5.2.json"
          )
          failed=0
          for suite in "${suites[@]}"; do
            stem="${suite%.json}"
            python scripts/s3a_compositional_frame_parser_v054.py \
              --input "medical/stage-evals/S3/${suite}" \
              --out "/tmp/s3a-v054/${stem}-predictions.json"
            set +e
            python scripts/eval_s3a_proposition_extraction_v02.py \
              --gold "medical/stage-evals/S3/${suite}" \
              --pred "/tmp/s3a-v054/${stem}-predictions.json" \
              --out "/tmp/s3a-v054/${stem}-report.json" \
              --min-f1 0.90 \
              --min-critical-recall 0.95 \
              --min-polarity-accuracy 0.95 \
              --min-population-accuracy 0.95 \
              --min-condition-accuracy 0.95
            status=$?
            set -e
            echo "${status}" > "/tmp/s3a-v054/${stem}-evaluator-exit.txt"
            cat "/tmp/s3a-v054/${stem}-report.json"
            if [ "${status}" -ne 0 ]; then failed=1; fi
          done
          echo "${failed}" > /tmp/s3a-v054/proposition-failed.txt

      - name: Evaluate exposed abstention safety
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          suites=['s3a-compositional-frame-heldout-v0.5.1.json','s3a-scope-safety-heldout-v0.5.2.json']
          reports=[]; overall=True
          for suite in suites:
              stem=suite[:-5]
              gold=json.load(open('medical/stage-evals/S3/'+suite,encoding='utf-8'))
              pred=json.load(open('/tmp/s3a-v054/'+stem+'-predictions.json',encoding='utf-8'))
              pm={x['item_id']:x for x in pred['predictions']}
              req=[x for x in gold['items'] if x.get('expected_abstain')]
              known=[x for x in gold['items'] if not x.get('expected_abstain')]
              req_ok=[]; req_fail=[]
              for x in req:
                  r=pm.get(x['item_id'],{})
                  ok=bool(r.get('abstain')) and not r.get('predicted_propositions')
                  (req_ok if ok else req_fail).append(x['item_id'])
              known_abst=[x['item_id'] for x in known if bool(pm.get(x['item_id'],{}).get('abstain'))]
              req_acc=len(req_ok)/len(req) if req else 1.0
              known_rate=len(known_abst)/len(known) if known else 0.0
              crit=gold['release_criteria']
              checks={
                'required_abstention_accuracy':req_acc>=crit['min_required_abstention_accuracy'],
                'known_case_abstention_rate':known_rate<=crit['max_known_case_abstention_rate'],
                'no_partial_truth_on_required_abstention':not req_fail,
              }
              rep={'suite':suite,'required_abstention_cases':len(req),'required_abstention_correct':len(req_ok),
                   'required_abstention_accuracy':req_acc,'required_abstention_failures':req_fail,
                   'known_cases':len(known),'known_case_abstentions':known_abst,'known_case_abstention_rate':known_rate,
                   'gate_checks':checks,'release_gate':'PASS' if all(checks.values()) else 'FAIL'}
              reports.append(rep); overall &= rep['release_gate']=='PASS'
          out={'suites':reports,'release_gate':'PASS' if overall else 'FAIL'}
          Path('/tmp/s3a-v054/abstention-report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Validate trace contract
        if: always()
        run: |
          python - <<'PY'
          import glob,json
          problems=[]; rows=0
          for p in glob.glob('/tmp/s3a-v054/*-predictions.json'):
              d=json.load(open(p,encoding='utf-8'))
              for row in d['predictions']:
                  rows+=1
                  if not {'scope_nodes','semantic_frames','predicted_propositions','abstain','unresolved_spans'} <= set(row):
                      problems.append((p,row.get('item_id'),'row_contract')); continue
                  for node in row['scope_nodes']:
                      if not {'node_id','text','condition_source'} <= set(node):
                          problems.append((p,row.get('item_id'),'scope_node_contract')); break
                  for f in row['semantic_frames']:
                      req={'event_type','subject','object','polarity','modality','source_span','trigger_family','scope_trace'}
                      if not req <= set(f) or not f.get('trigger_family') or not isinstance(f.get('scope_trace'),dict) or not f.get('scope_trace'):
                          problems.append((p,row.get('item_id'),'frame_contract')); break
          out={'rows':rows,'failures':problems,'release_gate':'PASS' if not problems else 'FAIL'}
          open('/tmp/s3a-v054/trace-report.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Check unsafe-simplification invariant
        if: always()
        run: |
          python - <<'PY'
          import json
          gold=json.load(open('medical/stage-evals/S3/s3a-scope-safety-heldout-v0.5.2.json',encoding='utf-8'))
          pred=json.load(open('/tmp/s3a-v054/s3a-scope-safety-heldout-v0.5.2-predictions.json',encoding='utf-8'))
          pm={x['item_id']:x for x in pred['predictions']}
          bad=[]
          for x in gold['items']:
              if not x.get('expected_abstain'): continue
              r=pm.get(x['item_id'],{})
              if (not r.get('abstain')) or r.get('predicted_propositions'):
                  bad.append({'item_id':x['item_id'],'abstain':r.get('abstain'),'predicted_propositions':r.get('predicted_propositions',[])})
          out={'required_abstention_items':sum(bool(x.get('expected_abstain')) for x in gold['items']),
               'unsafe_simplifications':bad,'release_gate':'PASS' if not bad else 'FAIL'}
          open('/tmp/s3a-v054/unsafe-simplification-report.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Combine development gates
        if: always()
        run: |
          python - <<'PY'
          import json
          prop_ok=open('/tmp/s3a-v054/proposition-failed.txt').read().strip()=='0'
          abst=json.load(open('/tmp/s3a-v054/abstention-report.json',encoding='utf-8'))
          trace=json.load(open('/tmp/s3a-v054/trace-report.json',encoding='utf-8'))
          unsafe=json.load(open('/tmp/s3a-v054/unsafe-simplification-report.json',encoding='utf-8'))
          gates={'all_exposed_proposition_suites':prop_ok,'abstention_safety':abst['release_gate']=='PASS',
                 'trace_contract':trace['release_gate']=='PASS','unsafe_simplification_invariant':unsafe['release_gate']=='PASS'}
          out={'version':'s3a-compositional-frame-v0.5.4','gate_checks':gates,
               'release_gate':'PASS' if all(gates.values()) else 'FAIL','fresh_validation':'NOT_RUN'}
          open('/tmp/s3a-v054/combined-development-release.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3a-v054-exposed-event-graph-regression
          path: /tmp/s3a-v054
          retention-days: 90

      - name: Enforce development release gate
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/s3a-v054/combined-development-release.json',encoding='utf-8'))
          if d['release_gate']!='PASS': raise SystemExit(2)
          PY
