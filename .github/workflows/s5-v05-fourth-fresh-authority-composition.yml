name: S5 v0.5 Fourth Fresh Authority-Composition Historical Preservation

on:
  push:
    paths:
      - 'medical/stage-evals/S5/fresh-first-observation-v0.5.json'
      - 'medical/stage-evals/S5/failures-v0.5.json'
      - 'medical/stage-evals/S5/S5_V0.5_FRESH_AUTHORITY_COMPOSITION_FAIL_REPORT.md'
      - '.github/workflows/s5-v05-fourth-fresh-authority-composition.yml'
  pull_request:
    paths:
      - 'medical/stage-evals/S5/fresh-first-observation-v0.5.json'
      - 'medical/stage-evals/S5/failures-v0.5.json'
      - 'medical/stage-evals/S5/S5_V0.5_FRESH_AUTHORITY_COMPOSITION_FAIL_REPORT.md'
      - '.github/workflows/s5-v05-fourth-fresh-authority-composition.yml'

jobs:
  preserve-first-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Protect immutable v0.5 first-observation artifacts
        run: |
          test "$(git rev-parse HEAD:medical/stage-evals/S5/fresh-first-observation-v0.5.json)" = 'c300d301cb6bf23e5ec1cc0472666f44a1148e77'
          test "$(git rev-parse HEAD:medical/stage-evals/S5/failures-v0.5.json)" = 'f2a9683516284a79435e18742d0e056bbf5784d8'

      - name: Reproduce v0.5 first observation at its exact historical commit
        run: |
          first_commit='fd19264c2fac77a879e8ed3d6f2a45400170bef7'
          cp medical/stage-evals/S5/fresh-first-observation-v0.5.json /tmp/s5-v05-expected.json
          rm -rf /tmp/groundsignal-s5-v05-first
          git worktree add --detach /tmp/groundsignal-s5-v05-first "$first_commit"
          cd /tmp/groundsignal-s5-v05-first
          set +e
          python scripts/eval_s5_fresh_boundary_v05.py --out /tmp/s5-v05-reproduced.json
          status=$?
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('/tmp/s5-v05-expected.json').read_text(encoding='utf-8'))
          observed=json.loads(Path('/tmp/s5-v05-reproduced.json').read_text(encoding='utf-8'))
          assert observed == expected
          assert observed['fresh_structural_gate'] == 'FAIL'
          assert observed['hard_gate_failures'] == ['S5-F16','S5-F17','S5-F18','S5-F19']
          assert observed['precondition_failures'] == []
          assert observed['stage_release'] == 'BLOCKED_GOLD_REVIEW'
          assert observed['s6_automatic_trust'] == 'BLOCKED'
          print('S5 v0.5 first fresh FAIL reproduced exactly at its historical implementation snapshot.')
          PY
