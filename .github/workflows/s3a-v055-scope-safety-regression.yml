name: s3a-v055-scope-safety-regression

on:
  push:
    paths:
      - "scripts/s3a_compositional_frame_parser_v055.py"
      - "scripts/eval_s3a_safety_errors_v055.py"
      - ".github/workflows/s3a-v055-scope-safety-regression.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exposed-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile \
            scripts/s3a_compositional_frame_parser_v055.py \
            scripts/s3a_compositional_frame_parser_v054.py \
            scripts/s3a_compositional_frame_parser_v053.py \
            scripts/s3a_compositional_frame_parser_v052.py \
            scripts/s3a_compositional_frame_parser_v051.py \
            scripts/s3a_compositional_frame_parser_v05.py \
            scripts/s3a_semantic_frame_extractor_v04.py \
            scripts/eval_s3a_proposition_extraction_v02.py \
            scripts/eval_s3a_safety_errors_v055.py

      - name: Run all exposed proposition regressions
        run: |
          mkdir -p /tmp/s3a-v055
          suites=(
            "v01|medical/stage-evals/S3/s3a-extraction-gold-v0.1.json"
            "v02|medical/stage-evals/S3/s3a-extraction-heldout-v0.2.json"
            "v03|medical/stage-evals/S3/s3a-extraction-heldout-v0.3.json"
            "v04|medical/stage-evals/S3/s3a-semantic-frame-heldout-v0.4.json"
            "v051|medical/stage-evals/S3/s3a-compositional-frame-heldout-v0.5.1.json"
            "v052|medical/stage-evals/S3/s3a-scope-safety-heldout-v0.5.2.json"
            "v054fresh|medical/stage-evals/S3/runs/s3a-v054-fresh-first-run/gold.json"
          )
          failed=0
          for entry in "${suites[@]}"; do
            alias="${entry%%|*}"
            path="${entry#*|}"
            python scripts/s3a_compositional_frame_parser_v055.py \
              --input "${path}" \
              --out "/tmp/s3a-v055/${alias}-predictions.json"
            set +e
            python scripts/eval_s3a_proposition_extraction_v02.py \
              --gold "${path}" \
              --pred "/tmp/s3a-v055/${alias}-predictions.json" \
              --out "/tmp/s3a-v055/${alias}-proposition-report.json" \
              --min-f1 0.90 \
              --min-critical-recall 0.95 \
              --min-polarity-accuracy 0.95 \
              --min-population-accuracy 0.95 \
              --min-condition-accuracy 0.95
            status=$?
            set -e
            echo "${status}" > "/tmp/s3a-v055/${alias}-proposition-exit.txt"
            if [ "${status}" -ne 0 ]; then failed=1; fi
          done
          echo "${failed}" > /tmp/s3a-v055/proposition-failed.txt

      - name: Evaluate exposed abstention safety
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          pairs=[
            ('v051','medical/stage-evals/S3/s3a-compositional-frame-heldout-v0.5.1.json'),
            ('v052','medical/stage-evals/S3/s3a-scope-safety-heldout-v0.5.2.json'),
            ('v054fresh','medical/stage-evals/S3/runs/s3a-v054-fresh-first-run/gold.json'),
          ]
          reports=[]; overall=True
          for alias,path in pairs:
              gold=json.load(open(path,encoding='utf-8'))
              pred=json.load(open(f'/tmp/s3a-v055/{alias}-predictions.json',encoding='utf-8'))
              pm={x['item_id']:x for x in pred['predictions']}
              req=[x for x in gold['items'] if x.get('expected_abstain')]
              known=[x for x in gold['items'] if not x.get('expected_abstain')]
              req_ok=[]; req_fail=[]
              for x in req:
                  r=pm.get(x['item_id'],{})
                  ok=bool(r.get('abstain')) and not r.get('predicted_propositions')
                  (req_ok if ok else req_fail).append(x['item_id'])
              known_abst=[x['item_id'] for x in known if bool(pm.get(x['item_id'],{}).get('abstain'))]
              req_acc=len(req_ok)/len(req) if req else 1.0
              known_rate=len(known_abst)/len(known) if known else 0.0
              crit=gold.get('release_criteria',{})
              min_req=crit.get('min_required_abstention_accuracy',1.0)
              max_known=crit.get('max_known_case_abstention_rate',0.05)
              checks={
                  'required_abstention_accuracy':req_acc>=min_req,
                  'known_case_abstention_rate':known_rate<=max_known,
                  'no_partial_truth_on_required_abstention':not req_fail,
              }
              rep={'suite':alias,'required_abstention_cases':len(req),'required_abstention_correct':len(req_ok),
                   'required_abstention_accuracy':req_acc,'required_abstention_failures':req_fail,
                   'known_cases':len(known),'known_case_abstentions':known_abst,'known_case_abstention_rate':known_rate,
                   'gate_checks':checks,'release_gate':'PASS' if all(checks.values()) else 'FAIL'}
              reports.append(rep); overall &= rep['release_gate']=='PASS'
          out={'suites':reports,'release_gate':'PASS' if overall else 'FAIL'}
          Path('/tmp/s3a-v055/abstention-report.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Evaluate semantic safety errors
        if: always()
        run: |
          suites=(
            "v01|medical/stage-evals/S3/s3a-extraction-gold-v0.1.json"
            "v02|medical/stage-evals/S3/s3a-extraction-heldout-v0.2.json"
            "v03|medical/stage-evals/S3/s3a-extraction-heldout-v0.3.json"
            "v04|medical/stage-evals/S3/s3a-semantic-frame-heldout-v0.4.json"
            "v051|medical/stage-evals/S3/s3a-compositional-frame-heldout-v0.5.1.json"
            "v052|medical/stage-evals/S3/s3a-scope-safety-heldout-v0.5.2.json"
            "v054fresh|medical/stage-evals/S3/runs/s3a-v054-fresh-first-run/gold.json"
          )
          failed=0
          for entry in "${suites[@]}"; do
            alias="${entry%%|*}"
            path="${entry#*|}"
            set +e
            python scripts/eval_s3a_safety_errors_v055.py \
              --gold "${path}" \
              --pred "/tmp/s3a-v055/${alias}-predictions.json" \
              --out "/tmp/s3a-v055/${alias}-safety-report.json"
            status=$?
            set -e
            echo "${status}" > "/tmp/s3a-v055/${alias}-safety-exit.txt"
            if [ "${status}" -ne 0 ]; then failed=1; fi
          done
          echo "${failed}" > /tmp/s3a-v055/safety-failed.txt

      - name: Validate trace contract
        if: always()
        run: |
          python - <<'PY'
          import glob,json
          problems=[]; rows=0
          for p in glob.glob('/tmp/s3a-v055/*-predictions.json'):
              d=json.load(open(p,encoding='utf-8'))
              for row in d['predictions']:
                  rows+=1
                  if not {'scope_nodes','semantic_frames','predicted_propositions','abstain','unresolved_spans'} <= set(row):
                      problems.append({'file':p,'item_id':row.get('item_id'),'reason':'row_contract'}); continue
                  for node in row['scope_nodes']:
                      if not {'node_id','text','condition_source'} <= set(node):
                          problems.append({'file':p,'item_id':row.get('item_id'),'reason':'scope_node_contract'}); break
                  for f in row['semantic_frames']:
                      req={'event_type','subject','object','polarity','modality','source_span','trigger_family','scope_trace'}
                      if not req <= set(f) or not f.get('trigger_family') or not isinstance(f.get('scope_trace'),dict) or not f.get('scope_trace'):
                          problems.append({'file':p,'item_id':row.get('item_id'),'reason':'frame_contract'}); break
          out={'rows':rows,'failures':problems,'release_gate':'PASS' if not problems else 'FAIL'}
          open('/tmp/s3a-v055/trace-report.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Combine development gates
        if: always()
        run: |
          python - <<'PY'
          import json
          prop_ok=open('/tmp/s3a-v055/proposition-failed.txt').read().strip()=='0'
          safety_ok=open('/tmp/s3a-v055/safety-failed.txt').read().strip()=='0'
          abst=json.load(open('/tmp/s3a-v055/abstention-report.json',encoding='utf-8'))
          trace=json.load(open('/tmp/s3a-v055/trace-report.json',encoding='utf-8'))
          gates={
              'all_exposed_proposition_suites':prop_ok,
              'abstention_safety':abst['release_gate']=='PASS',
              'semantic_safety_error_gate':safety_ok,
              'trace_contract':trace['release_gate']=='PASS',
          }
          out={'version':'s3a-compositional-frame-v0.5.5','gate_checks':gates,
               'release_gate':'PASS' if all(gates.values()) else 'FAIL','fresh_validation':'NOT_RUN'}
          open('/tmp/s3a-v055/combined-development-release.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s3a-v055-exposed-scope-safety-regression
          path: /tmp/s3a-v055
          retention-days: 90

      - name: Persist development raw outputs to repository
        if: always()
        run: |
          dest="medical/stage-evals/S3/runs/s3a-v055-development"
          mkdir -p "${dest}"
          cp -f /tmp/s3a-v055/* "${dest}/"
          python - <<'PY'
          import json,os,subprocess
          dest='medical/stage-evals/S3/runs/s3a-v055-development'
          impl=subprocess.check_output(['git','log','-1','--format=%H','--','scripts/s3a_compositional_frame_parser_v055.py'],text=True).strip()
          evaluator=subprocess.check_output(['git','log','-1','--format=%H','--','scripts/eval_s3a_safety_errors_v055.py'],text=True).strip()
          combined=json.load(open('/tmp/s3a-v055/combined-development-release.json',encoding='utf-8'))
          manifest={
              'version':'s3a-compositional-frame-v0.5.5',
              'implementation_last_change_commit':impl,
              'safety_evaluator_last_change_commit':evaluator,
              'workflow_source_commit':os.environ.get('GITHUB_SHA'),
              'github_run_id':os.environ.get('GITHUB_RUN_ID'),
              'fresh_validation':'NOT_RUN',
              'release_gate':combined['release_gate'],
              'historical_fresh_results_modified':False,
          }
          open(dest+'/manifest.json','w',encoding='utf-8').write(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${dest}"
          if ! git diff --cached --quiet; then
            git commit -m "S3a v0.5.5 eval: preserve exposed development results"
            git push
          fi

      - name: Enforce development release gate
        if: always()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/s3a-v055/combined-development-release.json',encoding='utf-8'))
          if d['release_gate']!='PASS': raise SystemExit(2)
          PY
