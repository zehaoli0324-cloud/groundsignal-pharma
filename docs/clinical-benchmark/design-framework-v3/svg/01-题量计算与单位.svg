<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#687481"/></marker>
<marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A74444"/></marker>
</defs>
<rect width="1800" height="1250" fill="#FFFFFF"/>
<text x="60" y="62" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#17324D">V3 题量：72 个受控 query，而不是 72 个独立病例</text>
<text x="60" y="98" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#687481">先冻结“题”的单位，再计算运行预算</text>
<rect x="60" y="125" width="300" height="38" rx="19" fill="#2C6E9F"/>
<text x="210.0" y="151" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">A 五层单位不能混算</text>
<rect x="60" y="185" width="285" height="120" rx="16" fill="#DCEAF7" stroke="#2C6E9F" stroke-width="2"/>
<text x="78" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#17324D">Hypothesis</text>
<text x="78" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243746"><tspan x="78" dy="0">可证伪失败机制</tspan></text>
<line x1="345" y1="245" x2="375" y2="245" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="390" y="185" width="285" height="120" rx="16" fill="#DCEAF7" stroke="#2C6E9F" stroke-width="2"/>
<text x="408" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#17324D">Clinical instance</text>
<text x="408" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243746"><tspan x="408" dy="0">同机制的真实 sibling</tspan></text>
<line x1="675" y1="245" x2="705" y2="245" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="720" y="185" width="285" height="120" rx="16" fill="#DCEAF7" stroke="#2C6E9F" stroke-width="2"/>
<text x="738" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#17324D">Variant / Query</text>
<text x="738" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243746"><tspan x="738" dy="0">一份受控题面</tspan></text>
<line x1="1005" y1="245" x2="1035" y2="245" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1050" y="185" width="285" height="120" rx="16" fill="#DCEAF7" stroke="#2C6E9F" stroke-width="2"/>
<text x="1068" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#17324D">Episode</text>
<text x="1068" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243746"><tspan x="1068" dy="0">一次完整多轮咨询</tspan></text>
<line x1="1335" y1="245" x2="1365" y2="245" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1380" y="185" width="285" height="120" rx="16" fill="#DCEAF7" stroke="#2C6E9F" stroke-width="2"/>
<text x="1398" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#17324D">Run / Seed</text>
<text x="1398" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#243746"><tspan x="1398" dy="0">同题随机重复</tspan></text>
<text x="900" y="350" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#A74444">只有 Variant / Query 计入“出多少题”；Episode、turn、seed 都是运行量，不是新题。</text>
<rect x="60" y="400" width="310" height="38" rx="19" fill="#2E7D5B"/>
<text x="215.0" y="426" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">B 每个 hypothesis 的题组</text>
<rect x="60" y="460" width="210" height="105" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="78" y="494" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">C0/P0</text>
<text x="78" y="526" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="78" dy="0">基线</tspan></text>
<rect x="300" y="460" width="210" height="105" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="318" y="494" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">C1/P1</text>
<text x="318" y="526" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="318" dy="0">弱压力</tspan></text>
<rect x="540" y="460" width="210" height="105" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="558" y="494" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">C1/P2</text>
<text x="558" y="526" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="558" dy="0">中压力</tspan></text>
<rect x="780" y="460" width="210" height="105" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="798" y="494" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">C1/P3</text>
<text x="798" y="526" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="798" dy="0">强压力</tspan></text>
<rect x="1020" y="460" width="210" height="105" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="1038" y="494" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">C2</text>
<text x="1038" y="526" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="1038" dy="0">阴性对照</tspan></text>
<rect x="1260" y="460" width="210" height="105" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="1278" y="494" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">C3</text>
<text x="1278" y="526" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="1278" dy="0">阳性对照</tspan></text>
<rect x="1500" y="460" width="210" height="105" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="1518" y="494" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">C4</text>
<text x="1518" y="526" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="1518" dy="0">救援/反转</tspan></text>
<text x="60" y="610" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">核心包 = 7 query；P0 已在 C0，不重复计算。可选 P4 组合压力另加 1 query，只估 interaction。</text>
<rect x="60" y="660" width="320" height="38" rx="19" fill="#6B52A3"/>
<text x="220.0" y="686" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">C 当前 reference family</text>
<rect x="60" y="720" width="1680" height="145" rx="16" fill="#ECE4F7" stroke="#6B52A3" stroke-width="2"/>
<text x="900" y="770" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#17324D">3 Hypotheses × 3 Sibling Instances × (7 Core + 1 P4) = 72 Queries</text>
<text x="900" y="820" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#243746">H1 风险升级｜H2 时间状态｜H3 来源权重；每条假设用 3 个真正不同临床实例复现</text>
<rect x="60" y="920" width="520" height="190" rx="16" fill="#F4F6F8" stroke="#8091A0" stroke-width="2"/>
<text x="78" y="954" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">M0 最小闭环</text>
<text x="78" y="986" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#243746"><tspan x="78" dy="0">1假设 × 2实例 × 7题面</tspan><tspan x="78" dy="25.7">14 query</tspan><tspan x="78" dy="25.7">42 episodes/模型（3 runs）</tspan></text>
<rect x="620" y="920" width="520" height="190" rx="16" fill="#FFF3C9" stroke="#9A7212" stroke-width="2"/>
<text x="638" y="954" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">M1 当前目标</text>
<text x="638" y="986" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#243746"><tspan x="638" dy="0">3假设 × 3实例 × 8题面</tspan><tspan x="638" dy="25.7">72 query</tspan><tspan x="638" dy="25.7">216 episodes/模型（3 runs）</tspan></text>
<rect x="1180" y="920" width="520" height="190" rx="16" fill="#FBE9D7" stroke="#B76820" stroke-width="2"/>
<text x="1198" y="954" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">M4 三旅程最小</text>
<text x="1198" y="986" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#243746"><tspan x="1198" dy="0">6假设 × 3实例 × 8题面</tspan><tspan x="1198" dy="25.7">144 query</tspan><tspan x="1198" dy="25.7">432 episodes/模型（3 runs）</tspan></text>
<text x="900" y="1170" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#A74444">当前仓库：1 hypothesis × 1 instance × 8 variants；这些 variant 不能冒充 8 个独立病例。</text>
</svg>
