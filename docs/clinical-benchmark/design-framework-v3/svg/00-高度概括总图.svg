<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#687481"/></marker>
<marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A74444"/></marker>
</defs>
<rect width="1800" height="1080" fill="#FFFFFF"/>
<text x="60" y="62" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#17324D">V3 总框架：从临床世界到可部署能力边界</text>
<text x="60" y="98" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#687481">一张图只保留六个一级模块；每个复杂模块在后续子图展开</text>
<rect x="60" y="125" width="1680" height="70" rx="14" fill="#FFF3C9" stroke="#9A7212" stroke-width="2"/>
<text x="900" y="168" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">核心对象不是一道题，而是：一个可证伪 Claim 经过实验、测量、复现与攻防后形成的证据包</text>
<rect x="60" y="270" width="250" height="190" rx="16" fill="#DCEAF7" stroke="#2C6E9F" stroke-width="2"/>
<text x="78" y="304" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">1 临床世界</text>
<text x="78" y="336" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="78" dy="0">患者旅程 + 决策链</tspan><tspan x="78" dy="23.0">定义真实要解决的问题</tspan></text>
<line x1="310" y1="365.0" x2="336" y2="365.0" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="344" y="270" width="250" height="190" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="362" y="304" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">2 实验网络</text>
<text x="362" y="336" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="362" dy="0">Hypothesis + Estimand</tspan><tspan x="362" dy="23.0">C0–C4 + 6 axes × L0–L4</tspan></text>
<line x1="594" y1="365.0" x2="620" y2="365.0" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="628" y="270" width="250" height="190" rx="16" fill="#ECE4F7" stroke="#6B52A3" stroke-width="2"/>
<text x="646" y="304" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">3 测量仪器</text>
<text x="646" y="336" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="646" dy="0">Oracle + Rubric</tspan><tspan x="646" dy="23.0">Checker + Judge</tspan></text>
<line x1="878" y1="365.0" x2="904" y2="365.0" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="912" y="270" width="250" height="190" rx="16" fill="#DDF2F0" stroke="#237B75" stroke-width="2"/>
<text x="930" y="304" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">4 执行与复现</text>
<text x="930" y="336" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="930" dy="0">FSM + Episode</tspan><tspan x="930" dy="23.0">seed ⊂ instance ⊂ family</tspan></text>
<line x1="1162" y1="365.0" x2="1188" y2="365.0" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1196" y="270" width="250" height="190" rx="16" fill="#F8DEDE" stroke="#A74444" stroke-width="2"/>
<text x="1214" y="304" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">5 对抗验证</text>
<text x="1214" y="336" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="1214" dy="0">Red → Blue → Purple</tspan><tspan x="1214" dy="23.0">CAUGHT / SURVIVED / VOID</tspan></text>
<line x1="1446" y1="365.0" x2="1472" y2="365.0" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1480" y="270" width="250" height="190" rx="16" fill="#FBE9D7" stroke="#B76820" stroke-width="2"/>
<text x="1498" y="304" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">6 边界输出</text>
<text x="1498" y="336" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="1498" dy="0">Failure Profile</tspan><tspan x="1498" dy="23.0">Capability → Deployment</tspan></text>
<rect x="60" y="520" width="300" height="38" rx="19" fill="#17324D"/>
<text x="210.0" y="546" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">横向合同：全链可追溯</text>
<rect x="60" y="585" width="375" height="125" rx="16" fill="#F4F6F8" stroke="#8091A0" stroke-width="2"/>
<text x="78" y="619" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">Claim Contract</text>
<text x="78" y="651" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="78" dy="0">允许说什么</tspan></text>
<rect x="480" y="585" width="375" height="125" rx="16" fill="#F4F6F8" stroke="#8091A0" stroke-width="2"/>
<text x="498" y="619" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">Version Binding</text>
<text x="498" y="651" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="498" dy="0">版本与 hash</tspan></text>
<rect x="900" y="585" width="375" height="125" rx="16" fill="#F4F6F8" stroke="#8091A0" stroke-width="2"/>
<text x="918" y="619" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">Clinical Governance</text>
<text x="918" y="651" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="918" dy="0">gold / 隐私 / 地区</tspan></text>
<rect x="1320" y="585" width="375" height="125" rx="16" fill="#F4F6F8" stroke="#8091A0" stroke-width="2"/>
<text x="1338" y="619" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">Release Gate</text>
<text x="1338" y="651" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="1338" dy="0">工程≠科学≠准入</tspan></text>
<rect x="60" y="770" width="1680" height="190" rx="18" fill="#F4F6F8" stroke="#17324D" stroke-width="2"/>
<text x="90" y="810" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#17324D">总框架的唯一主线</text>
<text x="90" y="855" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#243746"><tspan x="90" dy="0">临床问题决定要测什么；实验网络决定怎样排除替代解释；测量仪器决定怎样裁决；</tspan><tspan x="90" dy="29.0">执行与复现决定结果是否稳定；对抗验证决定高分是否来自捷径；最后才允许输出能力与部署边界。</tspan><tspan x="90" dy="29.0">任一前门失败，后门不得用总分补偿。</tspan></text>
<text x="900" y="1020" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#687481">展开图：题量｜临床过程｜因果实验｜测量仪器｜攻防｜准入</text>
</svg>
