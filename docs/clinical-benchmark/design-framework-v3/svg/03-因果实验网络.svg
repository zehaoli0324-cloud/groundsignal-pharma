<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#687481"/></marker>
<marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A74444"/></marker>
</defs>
<rect width="1800" height="1540" fill="#FFFFFF"/>
<text x="60" y="62" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#17324D">V3 因果实验网络：从 Claim 到可升级结论</text>
<text x="60" y="98" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#687481">Estimand 决定测什么；C0–C4 排除替代解释；G0–G7 决定最多能说到哪一步</text>
<rect x="60" y="125" width="300" height="38" rx="19" fill="#B76820"/>
<text x="210.0" y="151" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">A 实验族输入合同</text>
<rect x="60" y="185" width="520" height="170" rx="16" fill="#FBE9D7" stroke="#B76820" stroke-width="2"/>
<text x="78" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">Failure Hypothesis</text>
<text x="78" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="78" dy="0">目标阶段 + 目标压力</tspan><tspan x="78" dy="24.3">预期错误方向 + 替代解释</tspan></text>
<line x1="580" y1="270" x2="630" y2="270" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="185" width="520" height="170" rx="16" fill="#FFF3C9" stroke="#9A7212" stroke-width="2"/>
<text x="668" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">Estimand Contract</text>
<text x="668" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="668" dy="0">单位 / treatment / outcome</tspan><tspan x="668" dy="24.3">contrast / missingness / decision rule</tspan></text>
<line x1="1170" y1="270" x2="1220" y2="270" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1240" y="185" width="500" height="170" rx="16" fill="#F4F6F8" stroke="#8091A0" stroke-width="2"/>
<text x="1258" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">冻结不变量</text>
<text x="1258" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="1258" dy="0">truth / 必要信息 / 评分机会</tspan><tspan x="1258" dy="24.3">模型配置 / 数据边界 / 版本</tspan></text>
<rect x="60" y="410" width="270" height="38" rx="19" fill="#2E7D5B"/>
<text x="195.0" y="436" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">B C0–C4 实验臂</text>
<rect x="60" y="470" width="290" height="120" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="78" y="504" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">C0</text>
<text x="78" y="536" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="78" dy="0">基线 / P0</tspan></text>
<rect x="390" y="470" width="290" height="120" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="408" y="504" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">C1</text>
<text x="408" y="536" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="408" dy="0">目标干预 P1–P3</tspan></text>
<rect x="720" y="470" width="290" height="120" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="738" y="504" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">C2</text>
<text x="738" y="536" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="738" dy="0">阴性对照</tspan></text>
<rect x="1050" y="470" width="290" height="120" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="1068" y="504" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">C3</text>
<text x="1068" y="536" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="1068" dy="0">阳性对照</tspan></text>
<rect x="1380" y="470" width="290" height="120" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="1398" y="504" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">C4</text>
<text x="1398" y="536" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#243746"><tspan x="1398" dy="0">救援/反转</tspan></text>
<text x="900" y="635" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#A74444">actual_diff_paths 必须机械证明：除预注册目标字段外，其余语义不变量没有漂移。</text>
<rect x="60" y="680" width="330" height="38" rx="19" fill="#237B75"/>
<text x="225.0" y="706" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">C 压力轴与嵌套复现</text>
<rect x="60" y="740" width="520" height="160" rx="16" fill="#DDF2F0" stroke="#237B75" stroke-width="2"/>
<text x="78" y="774" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">Pressure</text>
<text x="78" y="806" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="78" dy="0">6 个 axes，各自 L0 → L4</tspan><tspan x="78" dy="24.3">axis interaction 另开 factorial 实验</tspan></text>
<rect x="640" y="740" width="520" height="160" rx="16" fill="#DDF2F0" stroke="#237B75" stroke-width="2"/>
<text x="658" y="774" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">Calibration</text>
<text x="658" y="806" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="658" dy="0">每条轴在 development pilot 校准</tspan><tspan x="658" dy="24.3">冻结后 held-out 不得按结果回调</tspan></text>
<rect x="1220" y="740" width="520" height="160" rx="16" fill="#DDF2F0" stroke="#237B75" stroke-width="2"/>
<text x="1238" y="774" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">Replication</text>
<text x="1238" y="806" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="1238" dy="0">run/seed ⊂ variant ⊂ instance</tspan><tspan x="1238" dy="24.3">⊂ family；seed 不是独立题</tspan></text>
<rect x="60" y="955" width="290" height="38" rx="19" fill="#6B52A3"/>
<text x="205.0" y="981" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">D G0–G7 串行门</text>
<rect x="60" y="1015" width="380" height="115" rx="16" fill="#ECE4F7" stroke="#6B52A3" stroke-width="2"/>
<text x="78" y="1049" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">G0 测量有效</text>
<text x="78" y="1081" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="78" dy="0">PASS / FAIL / UNRESOLVED</tspan></text>
