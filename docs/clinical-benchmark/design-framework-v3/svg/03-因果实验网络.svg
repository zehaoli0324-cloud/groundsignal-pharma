<text x="918" y="1081" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="918" dy="0">PASS / FAIL / UNRESOLVED</tspan></text>
<line x1="1280" y1="1073" x2="1305" y2="1073" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1320" y="1015" width="380" height="115" rx="16" fill="#ECE4F7" stroke="#6B52A3" stroke-width="2"/>
<text x="1338" y="1049" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">G3 检出能力</text>
<text x="1338" y="1081" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="1338" dy="0">PASS / FAIL / UNRESOLVED</tspan></text>
<rect x="60" y="1165" width="380" height="115" rx="16" fill="#ECE4F7" stroke="#6B52A3" stroke-width="2"/>
<text x="78" y="1199" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">G4 救援恢复</text>
<text x="78" y="1231" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="78" dy="0">PASS / FAIL / UNRESOLVED</tspan></text>
<line x1="440" y1="1223" x2="465" y2="1223" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="480" y="1165" width="380" height="115" rx="16" fill="#ECE4F7" stroke="#6B52A3" stroke-width="2"/>
<text x="498" y="1199" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">G5 压力响应</text>
<text x="498" y="1231" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="498" dy="0">PASS / FAIL / UNRESOLVED</tspan></text>
<line x1="860" y1="1223" x2="885" y2="1223" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="900" y="1165" width="380" height="115" rx="16" fill="#F8DEDE" stroke="#A74444" stroke-width="2"/>
<text x="918" y="1199" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">G6 多层复现</text>
<text x="918" y="1231" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="918" dy="0">PASS / FAIL / UNRESOLVED</tspan></text>
<line x1="1280" y1="1223" x2="1305" y2="1223" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
