<text x="498" y="1081" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="498" dy="0">PASS / FAIL / UNRESOLVED</tspan></text>
