<text x="1338" y="1199" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">G7 反作弊</text>
<text x="1338" y="1231" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="1338" dy="0">PASS / FAIL / UNRESOLVED</tspan></text>
<rect x="60" y="1345" width="1680" height="120" rx="16" fill="#F4F6F8" stroke="#17324D" stroke-width="2"/>
<text x="900" y="1392" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#17324D">结论阶梯：观察 → 关联 → 机制支持 → 压力曲线 → 稳定模式 → 能力边界</text>
<text x="900" y="1432" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#A74444">前一门失败，后一门结果不得补偿；NOT_TESTED 不能写成 PASS。</text>
