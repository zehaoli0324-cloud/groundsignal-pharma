<text x="1068" y="984" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#17324D">合理但方法错误</text>
<text x="1068" y="1016" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#243746"><tspan x="1068" dy="0">FAIL</tspan></text>
<rect x="1380" y="950" width="290" height="125" rx="16" fill="#F8DEDE" stroke="#A74444" stroke-width="2"/>
