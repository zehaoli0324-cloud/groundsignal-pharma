<rect x="60" y="1130" width="300" height="38" rx="19" fill="#17324D"/>
<text x="210.0" y="1156" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">E 极限测试 Release Gate</text>
<rect x="60" y="1190" width="1680" height="205" rx="16" fill="#F4F6F8" stroke="#17324D" stroke-width="2"/>
<text x="90" y="1235" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#243746"><tspan x="90" dy="0">所有 Critical 攻击已实际落地且被抓；所有未落地攻击标 VOID，不得计作防御成功；</tspan><tspan x="90" dy="30.0">独立正确实现不被误杀；每条防线有阳性和阴性对照；修复后可重放；</tspan><tspan x="90" dy="30.0">运行隔离、版本、provenance 与恢复 hash 完整；任何 Critical SURVIVED 均阻断发布。</tspan></text>
<text x="900" y="1460" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#A74444">Sentinel = 科学哨兵；Canary = 污染探针。二者不能混用，也不能只测误报而不测有效题召回。</text>
</svg>
