<text x="408" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="408" dy="0">指令注入 / rubric 模仿</tspan><tspan x="408" dy="20.2">事后编漂亮 reasoning</tspan></text>
