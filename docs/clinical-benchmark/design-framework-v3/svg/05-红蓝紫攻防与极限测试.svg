<text x="738" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">Proxy / 污染</text>
<text x="738" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="738" dy="0">metadata / 文件名 / class prior</tspan><tspan x="738" dy="20.2">sentinel 识别 / canary 命中</tspan></text>
