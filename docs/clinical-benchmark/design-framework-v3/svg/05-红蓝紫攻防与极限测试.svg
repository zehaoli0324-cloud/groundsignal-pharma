<text x="60" y="98" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#687481">只攻击自有 benchmark sandbox；目标是发现“表面高分 ≠ 目标能力”的路径</text>
