<text x="78" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#243746"><tspan x="78" dy="0">全急诊 / 全弃权</tspan><tspan x="78" dy="20.2">超长万金油</tspan></text>
