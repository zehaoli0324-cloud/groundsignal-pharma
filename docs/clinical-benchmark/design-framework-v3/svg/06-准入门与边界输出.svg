<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#687481"/></marker>
<marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A74444"/></marker>
</defs>
<rect width="1800" height="1360" fill="#FFFFFF"/>
<text x="60" y="62" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#17324D">V3 准入：工程可跑、科学可信、临床可用是三件不同的事</text>
<text x="60" y="98" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#687481">每道门有独立 owner、artifact 和阻断条件</text>
<rect x="60" y="125" width="310" height="38" rx="19" fill="#17324D"/>
<text x="215.0" y="151" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">A 三道不可替代的准入门</text>
<rect x="60" y="185" width="510" height="190" rx="16" fill="#DCEAF7" stroke="#2C6E9F" stroke-width="2"/>
<text x="78" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#17324D">Gate A 工程有效</text>
<text x="78" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="78" dy="0">schema / closure / deterministic run</tspan><tspan x="78" dy="24.3">artifact + receipt + version 可复现</tspan></text>
<line x1="570" y1="280" x2="605" y2="280" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="620" y="185" width="510" height="190" rx="16" fill="#ECE4F7" stroke="#6B52A3" stroke-width="2"/>
<text x="638" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#17324D">Gate B 测量与科学有效</text>
<text x="638" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="638" dy="0">estimand / controls / pressure / replication</tspan><tspan x="638" dy="24.3">G0–G7 + False Accept/Reject</tspan></text>
<line x1="1130" y1="280" x2="1165" y2="280" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1180" y="185" width="510" height="190" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="1198" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#17324D">Gate C 临床与部署准入</text>
<text x="1198" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="1198" dy="0">独立 clinical review / 风险预算</tspan><tspan x="1198" dy="24.3">适用范围 / human oversight / 责任链</tspan></text>
<text x="900" y="420" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#A74444">A PASS ≠ B PASS；A+B PASS 也不自动等于 C PASS。</text>
<rect x="60" y="470" width="280" height="38" rx="19" fill="#B76820"/>
<text x="200.0" y="496" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">B M0–M5 路线重排</text>
<rect x="60" y="530" width="510" height="150" rx="16" fill="#FBE9D7" stroke="#B76820" stroke-width="2"/>
<text x="78" y="564" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">M0  35 slots / error</text>
<text x="78" y="596" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="78" dy="0">单错误类型测量闭环</tspan></text>
<rect x="620" y="530" width="510" height="150" rx="16" fill="#FBE9D7" stroke="#B76820" stroke-width="2"/>
<text x="638" y="564" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">M1  盘点 N</text>
<text x="638" y="596" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="638" dy="0">冻结稀疏错误网络</tspan></text>
<rect x="1180" y="530" width="510" height="150" rx="16" fill="#FBE9D7" stroke="#B76820" stroke-width="2"/>
<text x="1198" y="564" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">M2  105N slots</text>
<text x="1198" y="596" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="1198" dy="0">3 sibling instances / error</tspan></text>
<rect x="60" y="720" width="510" height="150" rx="16" fill="#FBE9D7" stroke="#B76820" stroke-width="2"/>
<text x="78" y="754" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">M3  冻结</text>
<text x="78" y="786" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="78" dy="0">合同 / 分区 / 版本</tspan></text>
<rect x="620" y="720" width="510" height="150" rx="16" fill="#FBE9D7" stroke="#B76820" stroke-width="2"/>
<text x="638" y="754" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">M4  完整 Pilot</text>
<text x="638" y="786" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="638" dy="0">35 × I × N；不把 run 当题</tspan></text>
<rect x="1180" y="720" width="510" height="150" rx="16" fill="#FBE9D7" stroke="#B76820" stroke-width="2"/>
<text x="1198" y="754" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">M5  独立复测</text>
<text x="1198" y="786" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="1198" dy="0">held-out / 外部验证</tspan></text>
<rect x="60" y="950" width="310" height="38" rx="19" fill="#237B75"/>
<text x="215.0" y="976" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">C 最终不是总分，而是边界包</text>
<rect x="60" y="1010" width="510" height="155" rx="16" fill="#DDF2F0" stroke="#237B75" stroke-width="2"/>
<text x="78" y="1044" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">Failure Profile</text>
<text x="78" y="1076" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="78" dy="0">哪一环 / 什么错误 / 哪个压力</tspan></text>
<line x1="570" y1="1088" x2="605" y2="1088" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="620" y="1010" width="510" height="155" rx="16" fill="#DDF2F0" stroke="#237B75" stroke-width="2"/>
<text x="638" y="1044" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">Capability Boundary</text>
<text x="638" y="1076" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="638" dy="0">在哪些条件下仍可靠</tspan></text>
<line x1="1130" y1="1088" x2="1165" y2="1088" stroke="#687481" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1180" y="1010" width="510" height="155" rx="16" fill="#DDF2F0" stroke="#237B75" stroke-width="2"/>
<text x="1198" y="1044" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#17324D">Deployment Boundary</text>
<text x="1198" y="1076" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#243746"><tspan x="1198" dy="0">允许自主 / 必须复核 / 禁止</tspan></text>
<rect x="60" y="1220" width="1680" height="80" rx="16" fill="#FFF3C9" stroke="#9A7212" stroke-width="2"/>
<text x="900" y="1270" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#17324D">Pilot 输出必须写：研究结果，不构成临床批准；clinical_approval=false 直到真人临床审核者签署。</text>
</svg>
