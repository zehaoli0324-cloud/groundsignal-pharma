<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7885"/></marker></defs>
<rect width="1800" height="1380" fill="#FFFFFF"/>
<text x="60" y="62" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#17324D">V4 双闭环：既测模型，也测测量平台</text>
<text x="60" y="98" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#6B7885">模型失败与平台失效分别归因；修复后用原攻击和独立正确材料回放</text>
<rect x="60" y="125" width="260" height="38" rx="19" fill="#2E7D5B"/>
<text x="190.0" y="151" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">A 模型测量闭环</text>
<rect x="60" y="185" width="300" height="125" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
<text x="78" y="219" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#17324D">Hypothesis</text>
<text x="78" y="251" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#263847"><tspan x="78" dy="0.0">测什么失败</tspan></text>
<line x1="360" y1="248" x2="385" y2="248" stroke="#6B7885" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="400" y="185" width="300" height="125" rx="16" fill="#E1F1E8" stroke="#2E7D5B" stroke-width="2"/>
