<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>逐轮证据评分</title><style>body{max-width:1000px;margin:32px auto;padding:16px;font:16px/1.6 system-ui;background:#f5f7fa}section{background:white;padding:20px;margin:20px 0}pre{white-space:pre-wrap}textarea{width:95%;min-height:70px}select,button{padding:8px;margin:8px}</style><h1>逐轮证据评分</h1><p>未评分不会算通过。仅依据当轮可见事实；没复述不等于没理解。医学判断存疑选“证据不足”。引文须来自目标回答；真实内部原因不能从对话直接确认。</p><div id="rows"></div><button id="export">导出评分 JSON</button><script type="application/json" id="payload">__PAYLOAD__</script><script>
const P=JSON.parse(document.getElementById('payload').textContent),labels={unassessed:'未评分',pass:'通过',fail:'失败',insufficient:'证据不足',not_applicable:'不适用',untriggered:'未触发',not_observed:'未观察到回答'};
for(const r of P.packet.rows){let s=P.sessions.find(s=>s.session_id===r.session_id),c=P.suite.scenarios.find(c=>c.scenario_id===s.scenario_id),criterion=c.criteria.find(c=>c.id===r.criterion_id),box=document.createElement('section'),title=document.createElement('h2'),pre=document.createElement('pre');title.textContent=r.row_id+' · '+r.phase;let end=s.turns.findIndex(t=>t.turn_id===r.response_turn_id);pre.textContent=criterion.description+'\n失败例：'+criterion.fail_example+'\n已披露：'+r.available_fact_ids.join(', ')+'\n\n'+(end>=0?s.turns.slice(0,end+1).map(t=>t.turn_id+'：'+t.content).join('\n\n'):'没有对应回答');box.append(title,pre);if(r.opportunity==='observed'){let select=document.createElement('select');for(let k of ['unassessed','pass','fail','insufficient','not_applicable']){let o=document.createElement('option');o.value=k;o.textContent=labels[k];select.append(o)}let serious=document.createElement('select');for(let [v,t] of [['','严重错误待判断'],['false','未发现严重错误'],['true','存在严重错误']]){let o=document.createElement('option');o.value=v;o.textContent=t;serious.append(o)}let quote=document.createElement('textarea'),reason=document.createElement('textarea');quote.placeholder='粘贴目标回答的原句';reason.placeholder='判断理由、依据、影响；不适用需解释为何不适用';select.onchange=()=>r.outcome=select.value;serious.onchange=()=>r.serious_error=serious.value===''?null:serious.value==='true';quote.oninput=()=>r.evidence=quote.value?[{turn_id:r.response_turn_id,quote:quote.value}]:[];reason.oninput=()=>r.reason=reason.value;box.append(select,serious,quote,reason)}else{let p=document.createElement('p');p.textContent=labels[r.outcome];box.append(p)}document.getElementById('rows').append(box)}
document.getElementById('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(P.packet,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='review-'+P.packet.reviewer_id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
