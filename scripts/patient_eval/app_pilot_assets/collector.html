<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>应用对话采集</title><style>body{max-width:950px;margin:32px auto;padding:16px;font:17px/1.6 system-ui;background:#f5f7fa;color:#172b40}textarea{width:98%;min-height:100px}button,select,input{font:inherit;margin:5px;padding:8px}section{background:white;padding:20px;margin:18px 0;border-radius:12px}pre{white-space:pre-wrap}label{display:block}.note{color:#536579}</style>
<h1>应用对话采集</h1><p>合成情境开发试评。按题卡逐轮复制到应用，再完整粘贴回复。不要把事实表和评分标准发送给应用。页面不联网；刷新会丢失未导出的记录。</p>
<section><select id="slot"></select><label>操作者<input id="operator"></label><label>应用版本（不可见填“未知”）<input id="version"></label><label>所用模式<input id="mode"></label><label>设备<input id="device"></label><label>记忆设置<input id="memory"></label><label>联网设置<input id="network"></label><label>会话备注（包含引用保存方式）<input id="note"></label><label><input type="checkbox" id="reset">已新建会话并核对账户记忆设置</label><button id="start">开始此会话</button></section>
<section><h2 id="title">尚未开始</h2><pre id="history"></pre><div id="facts"></div><label>上一条应用回答中对应的追问原句<input id="quote"></label><select id="action"><option value="facts">回答被问到的事实</option><option value="unknown">不清楚</option><option value="continue">询问还需补充什么</option><option value="probe">结束自然阶段，进入解释探查</option><option value="event">发送到期更正</option></select><button id="next">生成下一条用户输入</button><h3>只复制以下文字到应用</h3><textarea id="prompt" readonly></textarea><button id="sent">我已在应用发送这条消息</button><label>应用完整回答<textarea id="answer"></textarea></label><label>应用展示的引用或截图文件名<textarea id="citations"></textarea></label><button id="saveAnswer">记录回答</button><button id="checkpoint">下载进行中备份</button></section>
<section><label>结束原因<input id="stop"></label><select id="status"><option value="completed">正常结束</option><option value="target_error">应用无响应／错误</option><option value="measurement_invalid">采集操作无效</option></select><label>异常说明<input id="error"></label><button id="export">结束并导出 JSON</button><p id="notice"></p></section>
<script type="application/json" id="payload">__PAYLOAD__</script><script>
'use strict';const P=JSON.parse(document.getElementById('payload').textContent),$=id=>document.getElementById(id);let s,c,known=new Set(),fired=new Set(),phase='natural',ended=false,pending=null;
function tell(e){$('notice').textContent=e.message||e}function need(v,m){if(!v)throw Error(m)}function download(v,name){let u=URL.createObjectURL(new Blob([JSON.stringify(v,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
for(const slot of P.plan.slots){let o=document.createElement('option');o.value=slot.slot_id;o.textContent=slot.slot_id+' · '+slot.platform+' · '+slot.scenario_id;$('slot').append(o)}
function currentAnswer(id){let value=c.facts.find(f=>f.id===id).answer;for(let e of c.events)if(fired.has(e.id)&&e.fact_overrides&&id in e.fact_overrides)value=e.fact_overrides[id];return value}
function draw(){$('history').textContent=s.turns.map(t=>t.turn_id+' '+t.role+'：'+t.content).join('\n\n');$('prompt').value=pending?pending.text:'';$('sent').disabled=!pending||pending.submitted;$('saveAnswer').disabled=!pending||!pending.submitted;}
function add(text,action,ids=[],event=null,question='',nextPhase=phase){need(!pending||!pending.submitted,'先记录正在等待的回答');pending={text,action,ids,event,question,phase:nextPhase,submitted:false};draw()}
$('sent').onclick=()=>{try{need(s&&!ended&&pending&&!pending.submitted,'没有尚未发送的草稿');let id='u'+(s.disclosure_log.length+1);phase=pending.phase;s.turns.push({turn_id:id,role:'user',content:pending.text});s.disclosure_log.push({turn_id:id,phase,action:pending.action,fact_ids:pending.ids,event_id:pending.event,question_quote:pending.question,submitted_at:new Date().toISOString()});pending.ids.forEach(x=>known.add(x));if(pending.event){known.add(pending.event);fired.add(pending.event)}pending.submitted=true;draw()}catch(e){tell(e)}};
$('checkpoint').onclick=()=>{try{need(s,'尚未开始');download({kind:'in_progress_backup_not_importable',session:s,pending},s.session_id+'-draft.json')}catch(e){tell(e)}};
$('start').onclick=()=>{try{need(!s||ended,'先导出当前会话');for(let k of ['operator','version','mode','device','memory','network','note'])need($(k).value.trim(),'请填写 '+k);need($('reset').checked,'需确认新会话');let slot=P.plan.slots.find(x=>x.slot_id===$('slot').value);c=P.suite.scenarios.find(x=>x.scenario_id===slot.scenario_id);known=new Set();fired=new Set();phase='natural';ended=false;pending=null;s={session_id:slot.slot_id+'-'+Date.now(),scenario_id:c.scenario_id,family_id:c.family_id,variant:c.variant,platform:slot.platform,observability:'black_box',status:'completed',turns:[],observations:[],trace:[],disclosure_log:[],metadata:{app_pilot_version:'app-pilot/v1',collected_at:new Date().toISOString(),app_version:$('version').value,platform_mode:$('mode').value,input_mode:'text',session_protocol_id:c.protocol_id,operator:$('operator').value,comparison_lane:'free_dialogue',question_source:'synthetic',conversation_reset:true,deidentification_confirmed:true,use_authorized:true,clinical_approval:false,suite_sha256:P.plan.suite_sha256,scenario_sha256:P.case_hashes[c.scenario_id],plan_sha256:P.plan_sha256,slot_id:slot.slot_id,device:$('device').value,memory_setting:$('memory').value,network_setting:$('network').value,session_note:$('note').value}};$('title').textContent=slot.platform+' · '+c.title;$('facts').replaceChildren();for(let f of c.facts){let l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=f.id;l.append(i,document.createTextNode(f.topic+'：'+f.answer));$('facts').append(l)}add(c.prefix[0].content,'opening')}catch(e){tell(e)}};
$('saveAnswer').onclick=()=>{try{need(s&&!ended&&pending&&pending.submitted,'需先确认已在应用发送');need($('answer').value.trim(),'请粘贴完整回答');s.turns.push({turn_id:'a'+s.disclosure_log.length,role:'assistant',content:$('answer').value,citations:$('citations').value});$('answer').value='';$('citations').value='';pending=null;draw()}catch(e){tell(e)}};
$('next').onclick=()=>{try{need(s&&!ended&&s.turns.length&&s.turns.at(-1).role==='assistant','先记录应用回答');let action=$('action').value,ids=[...$('facts').querySelectorAll('input:checked')].map(x=>x.value).sort(),n=s.disclosure_log.length,due=c.events.find(e=>!fired.has(e.id)&&e.requires.every(x=>known.has(x))&&n>=e.min_assistant_turns);need(phase!=='probe','探查仅一轮，请结束导出');if(action==='probe'){add(c.probe,'probe',[],null,'','probe');return}need(n<c.max_natural_answers,'自然轮次已满，可探查或导出');if(due){add(due.answer,'event',[],due.id);return}if(action==='facts'){need(ids.length,'请选择实际被问到的事实');let q=$('quote').value;need(q.trim()&&s.turns.at(-1).content.includes(q),'追问原句必须来自上一回答');add(ids.map(id=>currentAnswer(id)).join('\n'),'facts',ids,null,q)}else{need(['unknown','continue'].includes(action),'没有到期更正');add(action==='unknown'?c.unknown:c.continue_message,action)}$('facts').querySelectorAll('input').forEach(x=>x.checked=false);$('quote').value=''}catch(e){tell(e)}};
$('export').onclick=()=>{try{need(s&&s.turns.length,'没有实际已发送的输入');need($('stop').value.trim(),'填写结束原因');s.status=$('status').value;if(s.status==='completed')need(s.turns.at(-1).role==='assistant','正常结束必须有回答');else{need($('error').value.trim(),'填写异常说明');if(s.status==='target_error')s.error_detail=$('error').value;else{s.invalid_reason=$('error').value;s.invalid_component='collector'}}s.metadata.ended_at=new Date().toISOString();s.metadata.stop_reason=$('stop').value;download([s],s.session_id+'.json');ended=true;tell('已导出。保留原始截图；导入校验后才能进入评分。')}catch(e){tell(e)}};
</script></html>
