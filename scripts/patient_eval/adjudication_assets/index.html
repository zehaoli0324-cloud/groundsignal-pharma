<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'">
<title>GroundSignal · 分歧裁决</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18283e;background:#f3f6fa;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#173658;color:white;padding:1.4rem max(1rem,calc((100% - 1120px)/2))}h1{font-size:1.6rem;margin:0 0 .4rem}p{line-height:1.6}main{max-width:1120px;margin:auto;padding:1.4rem}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #466788;border-radius:6px;padding:.6rem 1rem;background:white;color:#173658}button.primary{background:#174f88;color:white}button:disabled{opacity:.5;cursor:default}input[type=text],textarea{border:1px solid #7990a9;border-radius:4px;padding:.5rem;width:100%}input[type=radio]{margin-right:.6rem}label{display:block;line-height:1.6;margin:.4rem 0}fieldset{border:1px solid #d3dce7;border-radius:8px;padding:1rem;margin:1rem 0}legend{font-weight:650}.bar{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}.layout{display:grid;grid-template-columns:240px 1fr;gap:1.2rem;margin-top:1rem}.card{background:white;border:1px solid #d7dfe9;padding:1.2rem;border-radius:8px}.opinions{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}.opinion{background:#eef4fc;border-left:3px solid #427eb6;padding:1rem}.muted{color:#4c6077}.status{font-size:1rem;font-weight:600}nav button{display:block;width:100%;text-align:left;margin:.5rem 0}nav button.active{background:#174f88;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;line-height:1.65}textarea{min-height:90px}#message{min-height:1.5rem;color:#8a251b}.small{font-size:.875rem}summary{cursor:pointer;padding:.4rem 0}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #de9a28;outline-offset:3px}@media(max-width:740px){.layout,.opinions{grid-template-columns:1fr}main{padding:1rem}.bar>*{max-width:100%}}
</style></head><body>
<header><h1>分歧裁决</h1><div>查看原文和两份意见，逐项确认最终选择。</div></header>
<main><div class="bar"><label>协调者姓名或编号<input id="actor" type="text" autocomplete="off"></label><button id="save">保存已确认的裁决</button><label>恢复裁决文件<input id="restore" type="file" accept=".json,application/json"></label></div>
<p class="muted small">本页已绑定两份答卷。切换题目前请确认，未确认的改选不会保存。原始意见保持不变；缺答或尚未确认的题目，请交回原评审补充。裁决结果不代表病例准入。</p>
<div id="message" role="status" aria-live="polite"></div><div class="layout"><aside class="card"><div id="counts"></div><nav id="nav" aria-label="题目状态"></nav></aside><section class="card"><div id="position" class="muted"></div><h2 id="title"></h2><div id="source"></div><div class="opinions"><div class="opinion" id="left"></div><div class="opinion" id="right"></div></div><div id="controls"></div><div class="bar"><button id="prev">上一项</button><button id="next">下一项</button></div></section></div></main>
<script id="data" type="application/json">__DATA__</script><script>/* APP */</script></body></html>
